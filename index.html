+'<div class="t-h3">📊 Gap Analysis — Анализ разрывов (As-Is → To-Be)</div>'
+'<div class="info-box">Формальная техника сравнения ТЕКУЩЕГО состояния (As-Is) и ЖЕЛАЕМОГО состояния (To-Be), чтобы точно определить, ЧТО нужно построить/изменить — это и есть «gap» (разрыв), который закрывают требования.</div>'
+'<div class="tw"><table>'
+'<tr><th>Шаг</th><th>Действие</th></tr>'
+'<tr><td>1</td><td>Задокументировать <b style="color:#f59e0b">As-Is</b> — как процесс/система работает СЕЙЧАС (обычно BPMN As-Is диаграмма + метрики: время, стоимость, ошибки)</td></tr>'
+'<tr><td>2</td><td>Задокументировать <b style="color:#6ee7b7">To-Be</b> — как процесс должен работать в ЦЕЛЕВОМ состоянии (BPMN To-Be + целевые метрики)</td></tr>'
+'<tr><td>3</td><td>Сравнить и выявить <b style="color:#93c5fd">Gaps</b> — конкретные разрывы: отсутствующие шаги, узкие места, дублирование, ручной труд там, где нужна автоматизация</td></tr>'
+'<tr><td>4</td><td>Приоритизировать gaps (MoSCoW/RICE) и превратить каждый в требование / User Story</td></tr>'
+'</table></div>'
+'<div class="tw"><table>'
+'<tr><th>Аспект</th><th style="color:#f59e0b">As-Is</th><th style="color:#6ee7b7">To-Be</th><th style="color:#93c5fd">Gap</th></tr>'
+'<tr><td>Обработка заявки</td><td>Менеджер вручную сверяет остатки в Excel, 25 мин</td><td>Система автоматически проверяет остатки в реальном времени, &lt;1 сек</td><td>Нужна интеграция с CRM/Inventory + автоматическая проверка остатков</td></tr>'
+'<tr><td>Согласование скидки</td><td>Email-цепочка руководителю, 1-2 дня</td><td>Автоматическое согласование по правилам (≤10% — авто, &gt;10% — руководитель)</td><td>Нужен модуль Business Rules Engine + workflow согласования</td></tr>'
+'</table></div>'
+'<div class="info-box green"><b>Как отличить от обычного BPMN As-Is/To-Be:</b> Gap Analysis — это не просто «нарисовать два процесса», а формальный ДОКУМЕНТ-АРТЕФАКТ, в котором каждый gap явно сформулирован, оценён по влиянию/усилиям и связан с конкретным требованием через RTM. На интервью важно показать именно эту связку: As-Is → To-Be → Gaps → Requirements.</div>'

+'<div class="t-h3">💰 Business Case и Cost-Benefit Analysis (ROI)</div>'
+'<div class="info-box">Business Case — документ, обосновывающий, СТОИТ ЛИ вообще делать проект, с точки зрения денег. Обычно готовится ДО старта проекта и утверждается спонсором/инвесткомитетом. Отличается от Vision & Scope тем, что Vision&Scope описывает ЧТО строим, а Business Case доказывает, ЗАЧЕМ это выгодно.</div>'
+'<div class="tw"><table>'
+'<tr><th>Раздел Business Case</th><th>Содержание</th></tr>'
+'<tr><td>Problem / Opportunity</td><td>Какую проблему решаем или какую возможность используем</td></tr>'
+'<tr><td>Options Considered</td><td>Альтернативные варианты решения (включая вариант «ничего не делать»)</td></tr>'
+'<tr><td>Costs</td><td>Затраты: разработка, лицензии, инфраструктура, обучение, поддержка</td></tr>'
+'<tr><td>Benefits</td><td>Выгоды: рост выручки, снижение затрат, снижение рисков (количественно, где возможно)</td></tr>'
+'<tr><td>Financial Analysis</td><td>ROI, Payback Period, иногда NPV</td></tr>'
+'<tr><td>Risks</td><td>Что может пойти не так и как это повлияет на цифры</td></tr>'
+'<tr><td>Recommendation</td><td>Рекомендуемый вариант и обоснование</td></tr>'
+'</table></div>'
+'<div class="info-box"><b>ROI (Return on Investment):</b> <code>ROI = (Выгода − Затраты) / Затраты × 100%</code>. Пример: затраты на проект — $50,000, ожидаемая дополнительная выручка за год — $80,000. ROI = (80,000 − 50,000) / 50,000 × 100% = <b>60%</b>.</div>'
+'<div class="info-box yellow"><b>Payback Period (срок окупаемости):</b> за сколько времени выгоды покроют затраты. Если проект экономит $5,000/месяц при затратах $50,000 — окупаемость наступит через 10 месяцев. Чем короче срок, тем менее рискованна инвестиция.</div>'
+'<div class="info-box green"><b>Зачем BA считать деньги, если это работа финансистов?</b> На Middle/Senior уровне BA должен уметь ХОТЯ БЫ грубо обосновать ценность фичи в цифрах, а не только «пользователям понравится». Именно Business Case/ROI — тот язык, на котором BA разговаривает с C-level и получает бюджет на проект.</div>'

+'<div class="t-h3">🔄 Change Management / Change Request (CR) Process</div>'
+'<div class="info-box">После утверждения Scope/Baseline любое новое требование или изменение существующего должно проходить через формальный процесс — иначе это прямой путь к scope creep. Change Management — не про запрет изменений, а про их КОНТРОЛИРУЕМОЕ принятие.</div>'
+'<div class="tw"><table>'
+'<tr><th>Шаг</th><th>Что происходит</th></tr>'
+'<tr><td>1. Submit</td><td>Стейкхолдер формально подаёт Change Request — что хочет изменить и зачем (не устно на созвоне!)</td></tr>'
+'<tr><td>2. Log</td><td>CR регистрируется в Change Log/Request Log с уникальным ID, статусом, датой</td></tr>'
+'<tr><td>3. Impact Analysis</td><td>BA/Tech Lead оценивают влияние на Scope, Schedule, Budget, Risks, связанные требования (через RTM)</td></tr>'
+'<tr><td>4. Review by CCB</td><td>Change Control Board (спонсор, PM, ключевые стейкхолдеры) рассматривает и выносит решение</td></tr>'
+'<tr><td>5. Decision</td><td>Approved / Rejected / Deferred (отложено на будущий релиз)</td></tr>'
+'<tr><td>6. Implement & Update</td><td>Если одобрено — обновляются Backlog/SRS/RTM/Baseline, команда информируется</td></tr>'
+'</table></div>'
+'<div class="tw"><table>'
+'<tr><th>CR ID</th><th>Описание</th><th>Инициатор</th><th>Влияние</th><th>Статус</th></tr>'
+'<tr><td>CR-014</td><td>Добавить оплату через Apple Pay</td><td>Marketing</td><td>+2 недели, +$4,000</td><td style="color:#fcd34d">На рассмотрении CCB</td></tr>'
+'<tr><td>CR-013</td><td>Убрать шаг подтверждения email при регистрации</td><td>Product Owner</td><td>−1 день, требует UX-ревью риска спама</td><td style="color:#6ee7b7">Approved</td></tr>'
+'</table></div>'
+'<div class="info-box"><b>Отличие от Agile-бэклога:</b> в Scrum формально «Change Request» как термин используют реже — новые идеи чаще просто попадают в Product Backlog и переоцениваются с PO перед следующим спринтом. Но при работе с фиксированным контрактом (Fixed Price), гос. заказчиками или в Waterfall-проектах формальный CR-процесс с CCB — обязателен, и его отсутствие — частая причина провала бюджета и сроков.</div>'
+'<div class="info-box yellow"><b>Частый вопрос на интервью:</b> «К вам подходит стейкхолдер в середине спринта с новой хотелкой — что делаете?» Правильный ответ — НЕ отказывать и НЕ сразу тащить в текущий спринт, а зафиксировать как CR/Backlog Item, оценить влияние с командой, и решить вместе с PO/CCB, когда и стоит ли это делать.</div>'
,

tech_arch:'<div class="t-h3">🏗️ Monolith vs Microservices — Архитектурные стили</div>'
+'<div class="info-box">Технический BA (особенно в ERP/интеграциях) регулярно сталкивается с этим выбором в обсуждениях NFR, бюджета и сроков. Не нужно уметь ПРОЕКТИРОВАТЬ архитектуру — нужно понимать компромиссы, чтобы задавать правильные вопросы и не удивляться, почему «простая фича» стоит 3 месяца.</div>'

+'<div class="tw"><table>'
+'<tr><th></th><th style="color:#93c5fd">Monolith</th><th style="color:#6ee7b7">Microservices</th></tr>'
+'<tr><td><b>Что это</b></td><td>Всё приложение — ОДИН развёртываемый artifact: UI, бизнес-логика, доступ к данным в одной кодовой базе</td><td>Приложение разбито на НЕЗАВИСИМЫЕ сервисы, каждый со своей базой данных, развёртывается отдельно</td></tr>'
+'<tr><td><b>Разработка</b></td><td>Проще начать — один репозиторий, один стек, простая отладка</td><td>Сложнее начать — нужна инфраструктура (API Gateway, service discovery, мониторинг)</td></tr>'
+'<tr><td><b>Масштабирование</b></td><td>Масштабируется ЦЕЛИКОМ, даже если нагружен только один модуль</td><td>Масштабируется НЕЗАВИСИМО — только тот сервис, который под нагрузкой</td></tr>'
+'<tr><td><b>Отказоустойчивость</b></td><td>Один баг может «уронить» ВСЁ приложение</td><td>Падение одного сервиса не обязательно останавливает остальные (изоляция отказов)</td></tr>'
+'<tr><td><b>Деплой</b></td><td>Любое изменение — передеплой ВСЕГО приложения</td><td>Каждый сервис деплоится независимо — быстрее релизы, меньше риск</td></tr>'
+'<tr><td><b>Команда</b></td><td>Одна команда легко работает над всем</td><td>Обычно 1 команда = 1-несколько сервисов (Conway&#39;s Law: структура ПО повторяет структуру организации)</td></tr>'
+'<tr><td><b>Сложность эксплуатации</b></td><td>Низкая — один процесс, один лог</td><td>Высокая — десятки сервисов, распределённые логи, сетевые задержки между сервисами</td></tr>'
+'<tr><td><b>Когда выбирают</b></td><td>Стартап, MVP, небольшая команда, неопределённые требования — важна СКОРОСТЬ старта</td><td>Крупный продукт, много команд, разные части системы растут с разной скоростью нагрузки</td></tr>'
+'</table></div>'

+'<div class="info-box green"><b>Классическая ошибка стартапов:</b> начать с микросервисов «на будущее», хотя команда — 3 разработчика и продукт ещё не нашёл product-market fit. Общепринятая рекомендация (в т.ч. от практиков вроде Martin Fowler): начинать с «модульного монолита» — единого приложения, но с чёткими внутренними границами модулей — и выделять микросервисы ПОЗЖЕ, когда конкретный модуль реально требует independent scaling или отдельной команды. Это называется <b>Monolith First</b>.</div>'

+'<div class="info-box yellow"><b>Что это значит для BA на практике:</b> при сборе NFR для новой системы стоит явно спросить: «Ожидается ли, что разные части системы будут расти/нагружаться с сильно разной скоростью?», «Сколько независимых команд будет работать над продуктом?», «Насколько критично, чтобы сбой одного модуля не ронял всю систему?» — ответы на эти вопросы напрямую влияют на архитектурный выбор, бюджет и сроки, которые придётся защищать перед стейкхолдерами.</div>'

+'<div class="t-h3">🔌 REST vs SOAP + основы JSON</div>'
+'<div class="info-box">Когда система интегрируется с внешним сервисом (платёжный шлюз, CRM, банк) — BA должен понимать хотя бы базовую разницу между форматами API, чтобы адекватно писать интеграционные требования и не путать разработчиков.</div>'

+'<div class="t-h3">JSON — базовый синтаксис</div>'
+'<div class="info-box">JSON (JavaScript Object Notation) — лёгкий текстовый формат обмена данными. Сегодня это ДЕ-ФАКТО стандарт для REST API. Структура — пары «ключ: значение», вложенные объекты в фигурных скобках {}, списки — в квадратных [].</div>'
+'<div class="tw"><table><tr><td style="font-family:monospace;font-size:0.78rem;white-space:pre;color:#93c5fd">{<br>&nbsp;&nbsp;"orderId": 10245,<br>&nbsp;&nbsp;"customer": {<br>&nbsp;&nbsp;&nbsp;&nbsp;"name": "Ivan Petrov",<br>&nbsp;&nbsp;&nbsp;&nbsp;"email": "ivan@example.com"<br>&nbsp;&nbsp;},<br>&nbsp;&nbsp;"items": [<br>&nbsp;&nbsp;&nbsp;&nbsp;{ "sku": "A100", "qty": 2 },<br>&nbsp;&nbsp;&nbsp;&nbsp;{ "sku": "B200", "qty": 1 }<br>&nbsp;&nbsp;],<br>&nbsp;&nbsp;"status": "confirmed"<br>}</td></tr></table></div>'
+'<div class="info-box"><b>Что важно уметь BA:</b> читать такую структуру (объект → поля → вложенные объекты/массивы) достаточно, чтобы понять, ЧТО передаётся между системами, и указать в требованиях конкретные обязательные/опциональные поля (например: «поле email обязательно, поле items — минимум 1 элемент»).</div>'

+'<div class="t-h3">REST vs SOAP</div>'
+'<div class="tw"><table>'
+'<tr><th></th><th style="color:#6ee7b7">REST</th><th style="color:#93c5fd">SOAP</th></tr>'
+'<tr><td><b>Что это</b></td><td>Архитектурный СТИЛЬ (набор принципов), не строгий протокол</td><td>Строгий ПРОТОКОЛ (Simple Object Access Protocol) со своим стандартом сообщений</td></tr>'
+'<tr><td><b>Формат данных</b></td><td>Обычно JSON (может быть и XML)</td><td>ТОЛЬКО XML</td></tr>'
+'<tr><td><b>Транспорт</b></td><td>HTTP-методы: GET, POST, PUT, DELETE — метод = действие</td><td>Обычно HTTP, но метод почти всегда POST — действие описано ВНУТРИ XML-тела</td></tr>'
+'<tr><td><b>Контракт</b></td><td>Гибкий, часто описывается OpenAPI/Swagger (необязательно)</td><td>Жёсткий, обязательный контракт — WSDL-файл (описывает каждый метод и структуру заранее)</td></tr>'
+'<tr><td><b>Вес сообщений</b></td><td>Лёгкий (JSON компактнее XML)</td><td>Тяжёлый — много служебной XML-разметки (envelope, header, body)</td></tr>'
+'<tr><td><b>Безопасность/транзакции</b></td><td>Полагается на HTTPS + токены (OAuth, JWT)</td><td>Встроенные корпоративные стандарты — WS-Security, поддержка распределённых транзакций</td></tr>'
+'<tr><td><b>Где чаще встречается</b></td><td>Современные веб/мобильные API, публичные API стартапов</td><td>Банки, страхование, госсектор, легаси корпоративные системы — где критична строгая типизация и надёжность контракта</td></tr>'
+'</table></div>'
+'<div class="info-box green"><b>Простыми словами для интервью:</b> REST — как гибкое соглашение «отправь мне JSON на этот адрес», SOAP — как строгий бюрократический протокол «заполни строго вот эту XML-форму, иначе не примем». REST проще и легче, SOAP надёжнее и строже — именно поэтому старые банковские и государственные системы часто до сих пор на SOAP, а новые продукты почти всегда выбирают REST.</div>'
+'<div class="info-box yellow"><b>Зачем это BA:</b> если стейкхолдер говорит «нам нужна интеграция с банком-партнёром», а банк даёт только SOAP/WSDL — это сразу сигнал для NFR-обсуждения: потребуется больше времени на реализацию (парсинг XML сложнее JSON), возможно отдельный adapter-слой, конвертирующий SOAP во внутренний REST/JSON API. Раннее распознавание этого в требованиях экономит недели на этапе оценки проекта.</div>'};

 exp:"DoR — «Вход» в спринт. Задача попадает в Sprint, только если соответствует DoR. Типичный DoR: User Story написана, AC определены, оценена в SP, нет блокеров. Без DoR команда берёт «сырые» задачи и теряет время на уточнения в ходе спринта."},

{sec:"theory",lab:"Agile & Scrum",type:"concept",
 q:"Чем Kanban отличается от Scrum по ключевому принципу управления потоком?",
 opts:["В Kanban нет визуализации процесса, в Scrum — есть","Kanban управляет потоком через WIP-лимиты; Scrum управляет через фиксированные итерации (спринты)","Kanban требует фиксированных ролей PO и SM, Scrum — нет","Kanban только для поддержки, Scrum — только для новой разработки"],
 ans:1,
 exp:"Kanban = управление потоком (flow). Главный инструмент — WIP-лимиты, ограничивающие количество задач в каждом статусе. Метрики: Lead Time, Cycle Time. Scrum = управление итерациями. Метрики: Velocity, Burndown chart."},

{sec:"theory",lab:"Agile & Scrum",type:"concept",
 q:"Роль BA в Scrum-команде: каковы основные обязанности?",
 opts:["BA заменяет Product Owner и управляет бэклогом","BA только пишет документацию по итогам разработки","BA помогает PO: пишет US и AC, проводит Refinement, является связующим между бизнесом и командой","BA отвечает за тестирование и приёмку функций"],
 ans:2,
 exp:"В Scrum BA работает в паре с PO: помогает выявлять и уточнять требования, пишет US и AC, ведёт Backlog Refinement, общается со стейкхолдерами. BA — «переводчик» между бизнесом и командой."},

{sec:"theory",lab:"Agile & Scrum",type:"concept",
 q:"Story Points — это:",
 opts:["Оценка времени выполнения задачи в часах","Относительная мера сложности задачи, учитывающая объём, сложность и неопределённость","Количество строк кода в задаче","Оценка бизнес-ценности задачи в деньгах"],
 ans:1,
 exp:"Story Points — ОТНОСИТЕЛЬНАЯ мера, не абсолютная. 5 SP не значит 5 часов. Учитывает: объём + техническую сложность + неизвестность/риск. Метод — Planning Poker (карты Фибоначчи: 1, 2, 3, 5, 8, 13). Velocity = среднее SP за спринт."},

{sec:"theory",lab:"Роль BA",type:"concept",
 q:"Что значит 'верификация требований' vs 'валидация требований'?",
 opts:["Это одно и то же — оба термина означают проверку требований","Верификация — правильно ли написано требование (внутренняя); Валидация — правильное ли требование (со стейкхолдерами)","Верификация делается после разработки, валидация — до","Верификация — задача QA, валидация — задача BA"],
 ans:1,
 exp:"Верификация: «Делаем продукт ПРАВИЛЬНО?» — проверяем что требования корректны, непротиворечивы, полны. Внутренняя проверка. Валидация: «Делаем ПРАВИЛЬНЫЙ продукт?» — проверяем со стейкхолдерами, что требования действительно решают бизнес-проблему."},

{sec:"theory",lab:"Роль BA",type:"concept",
 q:"Что такое трассировка требований и зачем она нужна?",
 opts:["Трассировка — это перевод требований на технический язык","Трассировка — связь между требованиями разных уровней. Позволяет проследить: каждая функция реализует требование стейкхолдера, которое достигает бизнес-цели","Трассировка — это расстановка приоритетов по методу MoSCoW","Трассировка — это оценка трудозатрат на реализацию"],
 ans:1,
 exp:"Трассировка (Requirements Traceability) позволяет ответить: «Зачем мы делаем эту функцию?» (связь с бизнес-целью), «Всё ли покрыто тестами?» (функция → тест-кейс). Инструмент: RTM. Без трассировки легко реализовать ненужные требования — gold plating."},

{sec:"theory",lab:"Артефакты BA",type:"concept",
 q:"Метод приоритизации MoSCoW: что означает каждая буква?",
 opts:["Must/Optional/Should/Can — 4 уровня обязательности","Must have / Should have / Could have / Won't have — обязательно / желательно / возможно / не сейчас","More/Some/Could/Wait — уровни срочности","Mandatory/Optional/Secondary/Closed — статусы требований"],
 ans:1,
 exp:"MoSCoW: Must have — без этого продукт не работает (MVP). Should have — важно, но можно запустить без. Could have — хорошо бы, если хватит времени. Won't have — сознательно откладываем. Must = первый релиз. Метод быстрый, но субъективный."},

{sec:"theory",lab:"Роль BA",type:"concept",
 q:"Что является главным результатом работы BA при анализе требований по BABOK?",
 opts:["Написать максимально подробное ТЗ на сотни страниц","Выявить реальную потребность бизнеса (не запрос), определить и согласовать требования так, чтобы команда создала ценное решение","Зафиксировать все пожелания заказчика без анализа","Выбрать технологический стек для реализации"],
 ans:1,
 exp:"BABOK: задача BA — выявить РЕАЛЬНУЮ потребность, а не просто записать пожелания. Заказчик часто описывает решение, а не проблему. BA должен докопаться: «Зачем это? Какую проблему решает?». Метод: 5 Почему."},

{sec:"theory",lab:"Техники выявления",type:"concept",

 opts:["Открытые — требуют развёрнутого ответа (Как? Почему? Что?), закрытые — Да/Нет. Открытые — для понимания, закрытые — для подтверждения","Открытые — задаются публично, закрытые — приватно","Открытые всегда лучше — нужно использовать только их","Закрытые вопросы запрещены в BA"],
 ans:0,
 exp:"Открытые вопросы (Who/What/When/Where/Why/How) дают развёрнутые ответы, понимание контекста. Начинать с них. Закрытые (Да/Нет) — для уточнения конкретных фактов. Правило: «Сначала открытые — понять, потом закрытые — подтвердить»."},

{sec:"theory",lab:"Agile",type:"concept",
 q:"В Agile-проекте заказчик хочет добавить крупное требование в середине спринта. Что должен сделать BA?",
 opts:["Немедленно добавить в Sprint Backlog — клиент важнее процесса","Занести в Product Backlog, оценить с PO и включить в следующий спринт","Отказать заказчику — в Agile изменения запрещены","Написать Change Request и приостановить спринт"],
 ans:1,
 exp:"Agile приветствует изменения, но не во время спринта — это нарушает Sprint Goal. Правильно: 1) Занести в Product Backlog. 2) BA помогает PO уточнить и оценить. 3) На Sprint Planning — включить в следующий спринт. Если критично — PO может прервать спринт, но это редко."},

{sec:"practice",lab:"Работа со стейкхолдерами",type:"choose",

 ctx:"Кейс: Интернет-магазин хочет программу лояльности. CEO: «Хочу бонусную систему, как у конкурентов». После интервью BA выяснил: цель — увеличить повторные покупки на 25%. Клиенты уходят после первой покупки.",
 q:"Какое бизнес-требование BA должен зафиксировать?",
 opts:["«Реализовать программу лояльности с cashback 5%»","«Увеличить долю повторных покупок на 25% за 12 месяцев»","«Добавить в систему модуль бонусов»","«Клиенты должны получать бонусы за покупки»"],
 ans:1,
 exp:"Бизнес-требование = SMART-цель (ЗАЧЕМ). «Увеличить долю повторных покупок на 25% за год» — измеримо. «Реализовать cashback» — это уже решение (требование стейкхолдера). BA зафиксировал реальную проблему (уход клиентов), а не предложенное решение."},

{sec:"practice",lab:"Кейс: программа лояльности",type:"case",
 ctx:"Продолжение. BA формулирует US: «Как покупатель, я хочу видеть количество бонусных баллов, чтобы понимать, на какую скидку могу рассчитывать».",
 q:"Какой Acceptance Criterion к этой US наиболее корректен?",
 opts:["«Баллы отображаются»","«Given пользователь авторизован в ЛК, When система загружает страницу, Then отображается: текущий баланс (N баллов), эквивалент в рублях, история начислений за 90 дней»","«Система должна быть быстрой при отображении баллов»","«Пользователь может видеть баллы»"],
 ans:1,
 exp:"Хороший AC: Given/When/Then, конкретные элементы с конкретными данными. QA пишет автотест по этому AC. Вариант 1 — нельзя проверить. Вариант 3 — NFR. Вариант 4 — перефразирование US."},

{sec:"practice",lab:"Анализ требований",type:"choose",
 ctx:"BA получил от заказчика требования: «Система должна работать быстро и надёжно» и «Система должна поддерживать авторизацию».",
 q:"Что не так и как исправить?",
 opts:["Всё в порядке — понятно команде","«Быстро и надёжно» — нет метрик (нарушение измеримости); «авторизация» — слишком широко (какой тип? OAuth? 2FA?). Нужна декомпозиция и числа","Это требования заказчика, их нельзя менять","NFR нужно удалить — они мешают"],
 ans:1,
 exp:"«Быстро» → «Загрузка страницы < 2 сек при 500 пользователях». «Надёжно» → «Доступность ≥ 99.5%/месяц». «Авторизация» → декомпозировать: авторизация email/пароль, Google OAuth, 2FA. Каждое требование должно быть проверяемым."},

{sec:"practice",lab:"Конфликт требований",type:"choose",
 ctx:"Директор продаж: «Скидка применяется автоматически для всех клиентов категории A». CFO: «Скидки > 10 000 руб. подтверждаются вручную контролёром».",
 q:"Как BA разрешает конфликт?",
 opts:["Реализовать оба требования одновременно","Принять сторону того, у кого выше должность","Зафиксировать конфликт, созвать встречу с обоими, выяснить корневые цели и найти компромисс","Игнорировать CFO — продажи важнее"],
 ans:2,
 exp:"Конфликт требований — нормально. Подход: 1) Зафиксировать конфликт. 2) Созвать встречу + спонсор. 3) Выяснить цели: продажи хотят скорость, финансы — контроль. 4) Компромисс: авто-скидка до 10к, ручное подтверждение выше. BA — медиатор, не арбитр."},

{sec:"practice",lab:"Кейс: онбординг",type:"case",
 ctx:"HR-директор: «Нужна система для онбординга». BA выяснил: онбординг занимает 2 недели ручной работы. Новые сотрудники не знают, к кому обращаться. IT не создаёт доступы вовремя.",
 q:"Какие типы требований BA зафиксирует из этих проблем?",
 opts:["Все три — это функциональные требования","Бизнес-требование: сократить время онбординга; требования стейкхолдеров: HR (автозадачи), новый сотрудник (дорожная карта), IT (интеграция с AD)","Всё — нефункциональные требования к производительности","Это проблемы, не требования"],
 ans:1,
 exp:"Декомпозиция: Бизнес-требование: сократить онбординг с 2 недель до N дней. Требования стейкхолдеров: HR хочет чеклист с автоназначением; новый сотрудник — дорожную карту; IT — автоматическое создание учёток. Каждое → функциональные US."},

{sec:"practice",lab:"Терминология",type:"concept",
 ctx:"На собеседовании: «Расскажите о жизненном цикле требований».",
 q:"Какой ответ наиболее полный и точный?",
 opts:["«Требования создаются в начале проекта и не меняются»","«ЖЦ: Выявление → Анализ → Документирование → Верификация → Валидация → Управление изменениями. В Agile — итеративно каждый спринт»","«Требования пишет заказчик, команда реализует»","«ЖЦ — делаем ТЗ в начале, согласуем и сдаём в конце»"],
 ans:1,
 exp:"ЖЦ требований по BABOK: Выявление → Анализ → Документирование → Верификация → Валидация → Управление изменениями. Требования — живой артефакт. В Agile этот цикл итеративный (каждый спринт). Требования изменяются, приоритизируются, трассируются."},

{sec:"practice",lab:"Кейс: кредитный конвейер",type:"case",
 ctx:"Банк автоматизирует выдачу кредитов. Текущее: подача → проверка документов вручную (2-3 дня) → кредитный комитет (1 день) → ответ клиенту. Цель: сократить до 4 часов.",
 q:"Какие первые шаги BA предпримет?",
 opts:["Сразу написать ТЗ на автоматизацию","Анализ текущего процесса (As-Is BPMN) + интервью с менеджерами и комитетом + выявить узкие места и бизнес-правила","Попросить IT создать прототип системы","Скопировать процесс конкурентов"],
 ans:1,
 exp:"Правильная последовательность: 1) Анализ документов — регламенты кредитования. 2) Наблюдение — как реально проверяются документы. 3) Интервью — узкие места, неявные правила. 4) As-Is BPMN — визуализировать текущий процесс. 5) Выявить узкие места для автоматизации. 6) To-Be BPMN. Только потом — требования к системе."},

{sec:"practice",lab:"DoR & DoD",type:"choose",
 ctx:"На Sprint Planning взяли задачу «Сделать кабинет пользователя». В ходе спринта: нет дизайна, нет AC, нет интеграционных требований.",
 q:"Нарушение какого принципа привело к ситуации и как предотвратить?",
 opts:["Нарушен DoD — задача не завершена правильно","Нарушен DoR — задача не была готова к взятию. Предотвращение: чеклист DoR, не брать задачи без него","Нарушен Sprint Goal","Нарушен DoD — нужно было написать больше тестов"],
 ans:1,
 exp:"Нарушен DoR. «Кабинет пользователя» не соответствовал готовности: нет описания, нет AC, нет дизайна, нет контрактов. Чеклист DoR: US сформулирована, AC написаны, дизайн согласован, зависимости устранены, задача оценена."},

{sec:"practice",lab:"Артефакты",type:"choose",
 ctx:"Разработчик спрашивает: «В чём разница между User Story и Use Case? Когда использовать что?»",
 q:"Как BA объяснит разницу?",
 opts:["Это одно и то же","US — минимальный формат для Agile (роль+действие+ценность+AC). Use Case — детальный формальный документ (актор+сценарии+альтернативы) для Waterfall","Use Case — для маленьких проектов, US — для больших","US пишет BA, Use Case — разработчик"],
 ans:1,
 exp:"US — для Agile: минимальная карточка намерения. Детали в AC. Use Case — для Waterfall: полный документ с предусловиями, основным потоком, альтернативами, постусловиями. На практике: в крупных проектах используют оба — US для бэклога, UC для сложных интеграций."},

{sec:"theory",lab:"Root Cause Analysis — 5 Whys",type:"concept",
 q:"Клиенты жалуются, что заказы задерживаются. После первого «Почему?» выясняется: «Потому что склад не успевает собрать заказ вовремя». Что нужно сделать дальше в технике 5 Whys?",
 opts:["Сразу написать требование «Ускорить сборку на складе» и закрыть анализ","Продолжить задавать «Почему?» к этому ответу, пока не дойдём до системной, устранимой первопричины (например, нехватка людей, неоптимальная раскладка товара, отсутствие приоритизации заказов)","Спросить склад, кто виноват в задержке","Перейти сразу к Диаграмме Исикавы, 5 Whys больше не нужен"],
 ans:1,
 exp:"Первый ответ — это ещё один симптом, а не корень. 5 Whys требует продолжать цепочку («Почему склад не успевает?» → «Почему не хватает людей?» → и т.д.), пока причина не станет системной и поддающейся устранению через процесс/требование, а не просто «работать быстрее»."},

{sec:"practice",lab:"Root Cause Analysis",type:"case",
 ctx:"BA собрал команду (разработчик, саппорт, продакт) для разбора проблемы «высокий процент возвратов товара». За 30 минут накидали десятки версий причин из разных областей: логистика, качество товара, описание на сайте, обучение персонала.",
 q:"Какой инструмент лучше всего подходит, чтобы СТРУКТУРИРОВАТЬ и не потерять причины из разных категорий, прежде чем выбирать приоритетную?",
 opts:["5 Whys — потому что он всегда единственно верный выбор","Диаграмма Исикавы (Fishbone) — раскладывает причины по категориям (People/Process/Technology/Data), не даёт упустить причину из «непопулярной» области","MoSCoW — приоритизация функций продукта","RACI-матрица — распределение ответственности"],
 ans:1,
 exp:"Когда причин много и они из разных областей, Fishbone/Ishikawa структурирует мозговой штурм по категориям (кости рыбы), чтобы не зациклиться на одной области (например, только на логистике) и не забыть про данные или процессы. После структурирования уже можно углубляться в конкретную ветку через 5 Whys."},

{sec:"theory",lab:"RACI-матрица",type:"concept",
 q:"В RACI-матрице на задачу «Утвердить финальный дизайн экрана» назначены: Дизайнер — R, Продакт-менеджер — A, UX-исследователь — C, Разработчик — I. Кто-то предлагает добавить второго Accountable — Head of Design, «на всякий случай, для подстраховки». Почему это плохая идея?",
 opts:["Потому что Head of Design вообще не должен быть в матрице","Потому что Accountable должен быть РОВНО ОДИН на задачу — иначе размывается финальная ответственность за решение, и в конфликтной ситуации непонятно, чьё слово последнее",
  "Потому что в RACI не может быть больше 4 ролей одновременно",
  "Потому что Accountable и Responsible всегда должны быть одним и тем же человеком"],
 ans:1,
 exp:"Ключевое правило RACI: на каждую задачу — ровно один Accountable. Если добавить второго «на всякий случай», в момент реального конфликта (например, дизайнер и Head of Design расходятся во мнении) непонятно, чьё решение финальное — это создаёт больше проблем, чем решает."},

{sec:"practice",lab:"Power-Interest Grid",type:"case",
 ctx:"Проект внедрения новой CRM. Среди стейкхолдеров: финансовый директор (мало интересуется деталями, но может заблокировать бюджет в любой момент) и рядовые менеджеры по продажам (будут ежедневно работать в системе, очень заинтересованы, но не имеют формального влияния на решения по проекту).",
 q:"Как правильно расположить этих двух стейкхолдеров на Power-Interest Grid и какая стратегия коммуникации вытекает из этого?",
 opts:[
  "Оба в один квадрант «Manage Closely» — общаться с обоими одинаково часто и подробно",
  "Финдиректор → «Keep Satisfied» (высокое влияние, низкий интерес — минимум деталей, но держать в курсе бюджета); менеджеры по продажам → «Keep Informed» (низкое влияние, высокий интерес — регулярные апдейты и демо, но не финальное слово в решениях)",
  "Финдиректор → «Monitor» (не важен), менеджеры → «Manage Closely»",
  "Стратегия коммуникации не зависит от квадранта — это чисто теоретическая модель"
 ],
 ans:1,
 exp:"Финдиректор обладает высоким ВЛИЯНИЕМ (может заблокировать бюджет), но низким ИНТЕРЕСОМ к деталям внедрения — квадрант Keep Satisfied: коротко, по существу, фокус на бюджете/рисках. Менеджеры по продажам — высокий ИНТЕРЕС (их непосредственная работа), но низкое формальное ВЛИЯНИЕ — квадрант Keep Informed: вовлекать через демо и апдейты, собирать обратную связь, но решения принимаются не ими."},

{sec:"theory",lab:"Gap Analysis",type:"concept",
 q:"В Gap Analysis документе Gap сформулирован так: «Нужно сделать процесс лучше». Почему это плохо сформулированный Gap и как исправить?",
 opts:[
  "Gap сформулирован нормально, дальше можно сразу писать требования",
  "Gap должен быть КОНКРЕТНЫМ разрывом между измеримым As-Is и измеримым To-Be, например: «As-Is: согласование скидки занимает 1-2 дня по email. To-Be: автоматическое согласование до 10% за секунды. Gap: нужен Business Rules Engine + workflow»",
  "Gap Analysis вообще не должен содержать формулировок, только диаграммы",
  "Слово «лучше» — это и есть корректная формулировка gap, если оно взято из интервью со стейкхолдером"
 ],
 ans:1,
 exp:"«Сделать лучше» — не gap, а благое пожелание: его нельзя ни оценить, ни превратить в требование, ни отследить через RTM. Корректный gap всегда опирается на измеримые As-Is и To-Be (время, стоимость, количество ошибок) и указывает конкретный недостающий элемент (система, процесс, роль), который нужно добавить или изменить."},

{sec:"practice",lab:"Gap Analysis",type:"case",
 ctx:"As-Is: клиент оформляет возврат товара через звонок в колл-центр, оператор вручную заводит заявку в 1С, среднее время обработки — 3 дня. To-Be (цель компании): клиент оформляет возврат самостоятельно в личном кабинете, заявка автоматически попадает в 1С, обработка — до 1 дня.",
 q:"Какой из следующих gap-ов сформулирован ПРАВИЛЬНО и готов к превращению в требования?",
 opts:[
  "«Нужно, чтобы возвраты обрабатывались быстрее»",
  "«Нужен раздел «Возврат товара» в личном кабинете с формой заявки + интеграция личного кабинета с 1С для автоматического создания заявки на возврат, что устранит ручной ввод оператором и сократит время обработки с 3 дней до 1 дня»",
  "«Колл-центр работает плохо, нужно обучение операторов»",
  "«1С нужно заменить на другую систему»"
 ],
 ans:1,
 exp:"Правильный gap связывает конкретный недостающий функционал (раздел в ЛК + интеграция с 1С) с измеримым улучшением (3 дня → 1 день) и явно указывает, какой ручной шаг устраняется (ввод оператором). Это уже готовая основа для Epic/User Stories, в отличие от общих пожеланий «быстрее» или «лучше»."},

{sec:"theory",lab:"Business Case & ROI",type:"concept",
 q:"Проект автоматизации складского учёта стоит $40,000. Ожидается, что он сэкономит компании $8,000 в месяц за счёт сокращения ошибок и ручного труда. Каков примерный срок окупаемости (Payback Period) и ROI за первый год?",
 opts:[
  "Payback ≈ 5 месяцев; ROI за год ≈ 140%",
  "Payback ≈ 5 месяцев; ROI за год ≈ 20%",
  "Payback ≈ 40 месяцев; ROI за год ≈ 8%",
  "Посчитать невозможно без данных о выручке компании"
 ],
 ans:0,
 exp:"Payback Period = Затраты / Ежемесячная экономия = 40,000 / 8,000 = 5 месяцев. Годовая выгода = 8,000 × 12 = 96,000. ROI = (Выгода − Затраты) / Затраты × 100% = (96,000 − 40,000) / 40,000 × 100% ≈ 140%. Такие цифры — типичный аргумент для получения бюджета у C-level."},

{sec:"practice",lab:"Business Case",type:"case",
 ctx:"CEO спрашивает BA: «Зачем нам вообще делать этот личный кабинет для клиентов? Это дорого». У BA есть данные: разработка — $60,000; сейчас колл-центр тратит $15,000/мес на обработку запросов, которые кабинет закроет на 70%.",
 q:"Как BA лучше всего аргументировать проект перед CEO, используя Business Case?",
 opts:[
  "«Все конкуренты уже так делают, нам тоже надо»",
  "«Экономия колл-центра составит ~$10,500/мес (70% от $15,000). При затратах $60,000 проект окупится примерно за 5.7 месяца, а за год принесёт чистую выгоду около $66,000 (ROI ≈ 110%)» — с явными цифрами Costs/Benefits/Payback",
  "«Пользователям точно понравится личный кабинет, это же современно»",
  "«Мы уже начали разработку, отступать поздно»"

 ans:1,
 exp:"C-level говорит на языке денег: Costs, Benefits, Payback Period, ROI — именно эти цифры убеждают выделить бюджет, а не общие фразы про «современность» или «конкурентов». Это ядро Business Case: показать, что выгода превышает затраты и с какой скоростью."},

{sec:"theory",lab:"Change Management / CR",type:"concept",
 q:"Проект ведётся по Fixed Price контракту с гос. заказчиком, Scope уже подписан (Baseline). Заказчик в середине разработки просит добавить новый модуль отчётности, которого не было в исходном ТЗ. Как правильно поступить?",
 opts:[
  "Молча добавить модуль, чтобы не портить отношения с заказчиком",
  "Отказать наотрез — Scope зафиксирован, изменения запрещены",
  "Оформить формальный Change Request: описать запрос, провести Impact Analysis (влияние на сроки/бюджет/риски), вынести на рассмотрение Change Control Board, и только после утверждения обновить Baseline и Scope",
  "Попросить разработчиков сделать модуль «в свободное время», не меняя официальный Scope"
 ],
 ans:2,
 exp:"В Fixed Price / Waterfall проектах с зафиксированным Baseline любое изменение обязано проходить через формальный CR-процесс: Submit → Impact Analysis → рассмотрение CCB → решение → обновление Scope/Budget/Schedule. Игнорирование этого процесса (варианты 1 и 4) — прямой путь к бесплатной работе и конфликту при сдаче проекта; жёсткий отказ (вариант 2) без анализа — тоже не всегда верно, если у заказчика есть готовность доплатить и сдвинуть сроки."},

{sec:"practice",lab:"Change Request",type:"case",
 ctx:"Идёт Agile-проект (Scrum, 2-недельные спринты). В середине текущего спринта Marketing-директор в личном чате пишет BA: «Срочно нужна кнопка «Поделиться в соцсетях» на странице товара, добавьте прямо сейчас, это важно для акции на следующей неделе».",
 q:"Что должен сделать BA в первую очередь?",
 opts:[
  "Немедленно передать задачу в текущий спринт в обход Scrum-процесса, раз это «срочно»",
  "Проигнорировать просьбу, потому что она пришла не через официальный канал",
  "Зафиксировать запрос как Backlog Item / неформальный CR с чётким описанием и бизнес-обоснованием, оперативно оценить с командой и Product Owner трудозатраты и влияние на Sprint Goal, и вместе с PO принять решение — брать в текущий спринт (если критично и есть ёмкость) или в следующий",

 ],
 ans:2,
 exp:"Даже в Agile «горящие» запросы не должны обходить процесс полностью — иначе команда живёт в постоянных прерываниях (нарушение Sprint Goal) а PO теряет контроль над приоритетами. Правильный баланс: быстро зафиксировать и оценить запрос, при необходимости эскалировать срочность, но решение о включении в спринт принимает PO с командой, а не единолично BA по личному чату."},


{sec:"theory",lab:"Monolith vs Microservices",type:"concept",
 q:"Стартап из 4 разработчиков без чёткого product-market fit планирует новый продукт и предлагает сразу строить архитектуру на 15 микросервисах «чтобы сразу масштабироваться». Что стоит порекомендовать?",
 opts:[
  "Поддержать план — микросервисы всегда лучше монолита",
  "Начать с монолита (желательно модульного, с чёткими внутренними границами) и выделять микросервисы позже, когда конкретный модуль реально потребует independent scaling или отдельной команды — подход «Monolith First»",
  "Использовать SOAP вместо REST для большей надёжности с самого начала",
  "Немедленно нанять DevOps-команду из 10 человек для поддержки микросервисной инфраструктуры"
 ],
 ans:1,
 exp:"Микросервисы добавляют существенную операционную сложность (service discovery, распределённые логи, сетевые задержки, отдельный деплой каждого сервиса) — это оправдано, когда команда большая и есть чёткое понимание, какие части системы растут с разной скоростью. Для маленькой команды без product-market fit это чистые накладные расходы, замедляющие поиск продукта. «Monolith First» — общепринятая практика: начать просто, выделять сервисы по мере реальной необходимости."},

{sec:"practice",lab:"Monolith vs Microservices",type:"case",
 ctx:"Крупный ритейлер: модуль каталога товаров испытывает нагрузку в 50 раз выше, чем модуль управления возвратами, и над продуктом работает 8 независимых команд. Сейчас всё — один монолит, и любой мелкий баг в возвратах требует передеплоя всего приложения, включая каталог.",
 q:"Какой архитектурный аргумент здесь СИЛЬНЕЕ всего в пользу перехода на микросервисы (хотя бы частичного)?",
 opts:[
  "Микросервисы модны и все крупные компании их используют",
  "Разная скорость роста нагрузки между модулями (каталог vs возвраты) требует независимого масштабирования, а 8 команд не могут эффективно работать в одной кодовой базе с общим циклом деплоя — оба фактора прямо соответствуют случаям, когда микросервисы оправданы",
  "Микросервисы автоматически делают код более читаемым",
  "Переход на микросервисы гарантированно снизит расходы на инфраструктуру"
 ],
 ans:1,
 exp:"Именно эти два признака — сильно разная скорость роста нагрузки между модулями и много независимых команд на одной кодовой базе — классические индикаторы, когда выгоды микросервисной архитектуры (независимое масштабирование, независимый деплой по командам) перевешивают операционные издержки. «Модно» и «снизит расходы» — не валидные архитектурные аргументы: микросервисы почти всегда УВЕЛИЧИВАЮТ операционные расходы, компенсируя это гибкостью, а не экономией."},

{sec:"theory",lab:"REST vs SOAP",type:"concept",
 q:"Партнёрский банк предоставляет доступ к своему API строго через WSDL-контракт с XML-сообщениями. Ваша команда привыкла работать с REST/JSON. Что из перечисленного — точная и корректная характеристика ситуации?",
 opts:[
  "Банк просто использует устаревшую технологию, нужно убедить их перейти на REST перед началом интеграции",
  "SOAP и REST взаимозаменяемы, разработчикам достаточно просто переименовать поля из XML в JSON",
  "Потребуется adapter-слой, конвертирующий SOAP/XML во внутренний REST/JSON формат — это дополнительная работа, которую стоит заложить в оценку сроков и NFR ещё на этапе сбора требований",
  "SOAP API нельзя использовать вместе с современными REST-системами в принципе"
 ],
 ans:2,
 exp:"SOAP остаётся стандартом во многих банковских/страховых/государственных системах именно из-за строгого контракта (WSDL) и встроенных стандартов безопасности (WS-Security) — переубедить банк перейти на REST нереалистично и не входит в задачи интеграционного проекта. Технически SOAP и REST совместимы через adapter/middleware слой, который парсит XML и конвертирует в/из JSON — но это дополнительный компонент разработки, который увеличивает срок и сложность, и грамотный BA должен зафиксировать это в оценке ещё на этапе анализа требований, а не как сюрприз в середине разработки."},

{sec:"practice",lab:"JSON и требования к API",type:"case",
 ctx:"Разработчик прислал такой пример JSON-ответа от API заказа: { \"orderId\": 555, \"customer\": { \"name\": \"Anna\" }, \"items\": [ { \"sku\": \"X1\", \"qty\": 3 } ], \"status\": \"pending\" }. Бизнес-стейкхолдер попросил вас написать требование: «система должна принимать email клиента при оформлении заказа, это поле обязательно».",
 q:"Глядя на структуру JSON выше, какое из требований к API вы должны зафиксировать разработчику, исходя из бизнес-запроса?",
 opts:[
  "Ничего дополнительно фиксировать не нужно — email наверняка уже где-то передаётся",
  "Нужно явно указать: в объекте customer должно появиться обязательное поле email (например, customer.email), так как в текущей структуре его нет — только name",
  "Нужно перевести весь API с JSON на XML, чтобы добавить email",
  "Email нужно добавить как отдельный элемент в массив items"
 ],
 ans:1,
 exp:"Это ключевой практический навык технического BA: читать существующую JSON-структуру буквально, поле за полем, а не полагаться на «наверняка передаётся». В примере объект customer содержит только name — значит, требование должно ЯВНО указывать, что нужно добавить новое обязательное поле (например, customer.email) именно в этот вложенный объект, а не в другое место структуры (например, ошибочно в items, что было бы концептуально неверно — email относится к покупателю, а не к товарным позициям)."},

Q.push({sec:"practice",lab:"Практика — Верификация требований",type:"choose",

// SQL questions
Q.push({sec:"practice",lab:"SQL — базовые запросы",type:"case",
 ctx:"Таблица orders: id, customer_id, status, total_amount, created_at\nТаблица customers: id, name, email, city",
 q:"Выбери все заказы со статусом 'completed' на сумму больше 5000 руб., отсортированные по дате (новые первыми). Какой запрос правильный?",
 opts:[
  "SELECT * FROM orders WHERE status = 'completed' OR total_amount > 5000 ORDER BY created_at DESC",
  "SELECT * FROM orders WHERE status = 'completed' AND total_amount > 5000 ORDER BY created_at DESC",
  "SELECT * FROM orders WHERE status = 'completed' AND total_amount > 5000 ORDER BY created_at ASC",
  "SELECT * FROM orders HAVING status = 'completed' AND total_amount > 5000 ORDER BY created_at DESC"
 ],
 ans:1,
 exp:"AND требует выполнения ОБОИХ условий одновременно — именно это нам нужно. OR дал бы заказы, где ХОТЯ БЫ одно условие выполнено. DESC = от большего к меньшему (новые даты первыми). ASC = от меньшего (старые даты первыми). HAVING используется только ПОСЛЕ GROUP BY для фильтрации групп, не строк — здесь он ошибочен."});

Q.push({sec:"practice",lab:"SQL — JOIN",type:"case",
 ctx:"Таблица orders: id, customer_id, status, total_amount\nТаблица customers: id, name, email",
 q:"Нужно получить список ВСЕХ клиентов и количество их заказов (включая тех, у кого заказов нет — показать 0). Какой запрос верный?",
 opts:[
  "SELECT c.name, COUNT(o.id) AS orders FROM orders o INNER JOIN customers c ON o.customer_id = c.id GROUP BY c.name",
  "SELECT c.name, COUNT(o.id) AS orders FROM customers c LEFT JOIN orders o ON c.id = o.customer_id GROUP BY c.id, c.name",
  "SELECT c.name, COUNT(*) AS orders FROM customers c RIGHT JOIN orders o ON c.id = o.customer_id GROUP BY c.name",
  "SELECT c.name, COUNT(o.id) AS orders FROM customers c, orders o WHERE c.id = o.customer_id GROUP BY c.name"
 ],
 ans:1,
 exp:"LEFT JOIN возвращает ВСЕХ клиентов из левой таблицы (customers), даже если у них нет совпадений в orders (тогда o.id = NULL). COUNT(o.id) считает непустые значения id — для клиентов без заказов даст 0, а не 1 (COUNT(*) дал бы 1 из-за самой строки). INNER JOIN отбросил бы клиентов без заказов. GROUP BY c.id, c.name — правильно включать первичный ключ."});

Q.push({sec:"practice",lab:"SQL — GROUP BY & HAVING",type:"case",
 ctx:"Таблица orders: id, customer_id, status, total_amount, created_at\n\nЗадача: найти клиентов, которые сделали БОЛЕЕ 3 заказов, и показать их суммарную выручку, только если она превышает 10 000 руб.",
 q:"Какой запрос решает задачу?",
 opts:[
  "SELECT customer_id, COUNT(*) as cnt, SUM(total_amount) as total FROM orders WHERE COUNT(*) > 3 AND SUM(total_amount) > 10000 GROUP BY customer_id",
  "SELECT customer_id, COUNT(*) as cnt, SUM(total_amount) as total FROM orders GROUP BY customer_id HAVING COUNT(*) > 3 AND SUM(total_amount) > 10000",
  "SELECT customer_id, COUNT(*) as cnt, SUM(total_amount) as total FROM orders GROUP BY customer_id WHERE COUNT(*) > 3 HAVING SUM(total_amount) > 10000",
  "SELECT customer_id, COUNT(*) as cnt, SUM(total_amount) as total FROM orders HAVING COUNT(*) > 3 AND SUM(total_amount) > 10000"
 ],
 ans:1,
 exp:"HAVING — это фильтр ПОСЛЕ группировки, именно для агрегатных функций COUNT, SUM, AVG и т.д. WHERE нельзя использовать с агрегатными функциями — это ошибка синтаксиса. Порядок: FROM → WHERE (если есть фильтр по строкам) → GROUP BY → HAVING → SELECT → ORDER BY. В варианте В WHERE стоит ПОСЛЕ GROUP BY — неправильный синтаксис, WHERE всегда до GROUP BY."});

Q.push({sec:"practice",lab:"SQL — практика BA",type:"choose",
 ctx:"BA работает с командой разработки. В базе данных есть таблица users (id, email, status, created_at) и таблица payments (id, user_id, amount, created_at, status). Нужно проверить: 'Сколько активных пользователей совершили хотя бы один платёж за последние 30 дней на сумму > 1000 руб.'",
 q:"Какой подход к написанию запроса правильный?",
 opts:[
  "SELECT COUNT(*) FROM users WHERE status = 'active'",
  "SELECT COUNT(DISTINCT p.user_id) FROM payments p JOIN users u ON p.user_id = u.id WHERE u.status = 'active' AND p.amount > 1000 AND p.created_at >= CURRENT_DATE - INTERVAL '30 days' AND p.status = 'completed'",
  "SELECT COUNT(*) FROM users u, payments p WHERE u.status = 'active' AND p.amount > 1000",
  "SELECT user_id FROM payments WHERE amount > 1000 GROUP BY user_id HAVING COUNT(*) >= 1"
 ],
 ans:1,

var results = new Array(Q.length).fill(null);

function secClass(s){return s==='theory'?'sl1':'sl2';}

function switchTab(id){theoryTab=id;renderTheory();}
function startQuiz(){state='quiz';cur=0;renderQ();}

function renderDots(){
  var h='';
  for(var i=0;i<Q.length;i++){
    var isTheory=Q[i].sec==='theory';
    var c='dot',lbl=(isTheory?'T':'P')+(i+1);
    if(i===cur)c+=' cur';
    else if(results[i]===true)c+=' ok';
    else if(results[i]===false)c+=' fail';
    h+='<div class="'+c+'" onclick="goTo('+i+')" title="'+(isTheory?'Теория':'Практика')+' '+(i+1)+'">'+lbl+'</div>';
  }
  return h;
}

function renderQ(){
  if(cur>=Q.length){renderScore();return;}
  var q=Q[cur],done=results[cur]!==null,sel=chosen[cur],keys=['A','B','C','D'];
  document.getElementById('plabel').textContent=(q.sec==='theory'?'Теория ':'Практика ')+(cur+1)+' из '+Q.length;
  document.getElementById('pscore').textContent='Счёт: '+score;
  document.getElementById('pfill').style.width=(((cur+1)/Q.length)*100).toFixed(0)+'%';
  var optsHtml='';
  for(var i=0;i<q.opts.length;i++){
    var c='opt';
    if(done){c+=' dis';if(i===q.ans)c+=' correct';else if(i===sel&&sel!==q.ans)c+=' wrong';}
    else if(i===sel)c+=' sel';
    optsHtml+='<div class="'+c+'" onclick="pick('+i+')">'+'<span class="okey">'+keys[i]+'</span>'+q.opts[i]+'</div>';
  }
  var fbCls=done?(results[cur]?'fb ok show':'fb fail show'):'fb';
  var fbTxt=done?(results[cur]?'✅ Верно! ':'❌ Неверно. ')+'<b>Пояснение:</b> '+q.exp:'';
  var ctx=q.ctx?'<div class="ctx-box">📌 '+q.ctx+'</div>':'';
  var sb=(!done&&sel!==null)?'<button class="btn btn-p" onclick="submit()">Ответить</button>':'';
  var nb=done?'<button class="btn btn-p" onclick="nxt()">'+(cur===Q.length-1?'Результаты →':'Далее →')+'</button>':'';
  document.getElementById('app').innerHTML=

    +'<span class="qtype">'+typeLabel(q.type)+'</span>'
    +'<div class="qcard">'
      +'<div class="qnum">Вопрос '+(cur+1)+'/'+Q.length+' — '+q.lab+'</div>'
      +'<div class="qtext">'+q.q+'</div>'+ctx
      +'<div class="opts">'+optsHtml+'</div>'
      +'<div class="'+fbCls+'">'+fbTxt+'</div>'

      +'<div style="display:flex;gap:8px">'
        +'<button class="btn btn-g" onclick="prv()" '+(cur===0?'disabled':'')+'>← Назад</button>'

      +'</div>'
      +'<div style="display:flex;gap:8px">'+sb+nb+'</div>'
    +'</div>';
}

function pick(i){if(results[cur]!==null)return;chosen[cur]=i;renderQ();}
function submit(){if(chosen[cur]===null)return;var ok=chosen[cur]===Q[cur].ans;results[cur]=ok;if(ok)score++;renderQ();}
function nxt(){if(cur<Q.length-1){cur++;renderQ();}else{renderScore();}}
function prv(){if(cur>0){cur--;renderQ();}}
function goTo(i){cur=i;renderQ();}
function backToTheory(){state='theory';renderTheory();}

function renderScore(){
  var th=0,pr=0,thT=0,prT=0;
  for(var i=0;i<Q.length;i++){
    if(Q[i].sec==='theory'){thT++;if(results[i]===true)th++;}
    else{prT++;if(results[i]===true)pr++;}
  }
  var total=th+pr,grandTotal=Q.length,pct=Math.round(total/grandTotal*100);
  var grade=pct>=90?'🏆 Эксперт':pct>=75?'⭐ Продвинутый':pct>=60?'✅ Уверенный':pct>=45?'📈 Прогресс':'📚 Учись дальше';
  document.getElementById('pfill').style.width='100%';
  document.getElementById('plabel').textContent='Тест завершён!';
  document.getElementById('pscore').textContent='Итог: '+total+'/'+grandTotal+' ('+pct+'%)';
  var types=['concept','classify','write','choose','case'];
  var tn={concept:'Концепция',classify:'Классификация',write:'Формулирование',choose:'Выбор',case:'Кейс'};
  var ts={},tt={};
  types.forEach(function(t){ts[t]=0;tt[t]=0;});
  for(var i=0;i<Q.length;i++){var t=Q[i].type;if(tt[t]===undefined){tt[t]=0;ts[t]=0;types.push(t);}tt[t]++;if(results[i]===true)ts[t]++;}
  var typeHtml='';
  types.forEach(function(t){
    if(tt[t]>0){var p=Math.round(ts[t]/tt[t]*100),col=p>=80?'#6ee7b7':p>=60?'#f59e0b':'#fca5a5';
    typeHtml+='<div class="fb-item"><span>'+(tn[t]||t)+'</span><span style="color:'+col+';font-weight:700">'+ts[t]+'/'+tt[t]+'</span></div>';}
  });
  document.getElementById('app').innerHTML=
