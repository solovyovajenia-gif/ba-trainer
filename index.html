 opts:["Агрегация (пустой ромб) — слабое владение, часть может существовать независимо; Композиция (закрашенный ромб) — сильное владение, часть уничтожается вместе с целым","Композиция — слабое владение; Агрегация — сильное","Они семантически одинаковы, разница только в нотации","Агрегация — для примитивов; Композиция — для объектов"],
 ans:0,
 exp:"Ключевое различие — жизненный цикл. Композиция (◆ закрашенный): Room не существует без House. Агрегация (◇ пустой): Employee может принадлежать нескольким Department и существует независимо. Это важно для каскадного удаления в БД и ORM."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"В Sequence Diagram: чем синхронный вызов отличается от асинхронного по нотации?",
 opts:["Синхронный — сплошная стрелка с закрашенным наконечником (▶); асинхронный — сплошная стрелка с открытым наконечником (▷)","Синхронный — пунктирная стрелка; асинхронный — сплошная","Синхронный — горизонтальная стрелка; асинхронный — диагональная","Разницы в нотации нет — только комментарий"],
 ans:0,
 exp:"Синхронный call (▶ filled arrowhead) — отправитель ЖДЁТ ответа, показывается activation box. Асинхронный (▷ open arrowhead) — fire-and-forget, отправитель продолжает без ожидания. Возврат всегда пунктирная стрелка с открытым наконечником (- - ▷)."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"Какой UML-элемент используется в Activity Diagram для запуска параллельных потоков (fork) и их синхронизации (join)?",
 opts:["Decision Node (ромб) с несколькими исходящими потоками","Fork/Join Node — толстая горизонтальная или вертикальная черта","Initial Node (закрашенный круг) с несколькими стрелками","Merge Node (ромб) с несколькими входящими потоками"],
 ans:1,
 exp:"Fork Node (толстая черта) делит один поток на несколько параллельных — все исходящие пути активируются одновременно. Join Node (толстая черта) ждёт ВСЕХ входящих потоков перед продолжением. Decision/Merge — для условных развилок. Initial Node — только точка старта."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"В BPMN 2.0, какой Gateway маршрутизирует поток к первому наступившему событию (например: получен платёж ИЛИ истёк таймер)?",
 opts:["Parallel Gateway (AND) — запускает все пути одновременно","Exclusive Gateway (XOR) — берёт один путь по условию","Event-Based Gateway — берёт путь того события, которое наступило первым","Inclusive Gateway (OR) — активирует один или несколько путей"],
 ans:2,
 exp:"Event-Based Gateway (шестигранник с двойным кругом внутри) — специально для гонки событий. После него стоят catching events (Message, Timer и т.д.). Какое событие наступило первым — тот путь и выбирается. XOR работает с data conditions, а не с событиями."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"Чем Call Activity отличается от Sub-Process в BPMN 2.0?",
 opts:["Call Activity — глобально переиспользуемый процесс (жирная рамка); Sub-Process — локально встроенный (тонкая рамка)","Sub-Process — глобальный; Call Activity — локальный","Call Activity не может иметь Boundary Events; Sub-Process — может","Они идентичны — разница только в визуальном отображении"],
 ans:0,
 exp:"Call Activity (толстая/жирная рамка + '+') вызывает ГЛОБАЛЬНО определённый процесс — он переиспользуется из нескольких мест, версионируется отдельно. Sub-Process (тонкая рамка + '+') встроен ЛОКАЛЬНО в родительский процесс. Правило: если один и тот же кусок логики вызывается в 3+ местах — делай Call Activity."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"В BPMN: что такое Non-Interrupting Boundary Event и как он визуально отличается от Interrupting?",
 opts:["Non-Interrupting — ПУНКТИРНАЯ граница круга; задача продолжается, запускается параллельный путь","Non-Interrupting — СПЛОШНАЯ граница; прерывает задачу","Non-Interrupting — двойная граница круга","Визуального отличия нет — только атрибут в XML"],
 ans:0,
 exp:"Non-Interrupting Boundary Event — DASHED (пунктирный) круг на границе задачи. При срабатывании запускает ПАРАЛЛЕЛЬНЫЙ путь, НЕ отменяя основную задачу. Interrupting (сплошной круг) — отменяет задачу и уводит поток на обработчик. Типичный пример: таймер-напоминание без отмены основного шага."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"Какая нотация на Class Diagram означает РЕАЛИЗАЦИЮ интерфейса (implements)?",
 opts:["Сплошная линия с закрашенным треугольником (наследование)","Пунктирная линия с открытым (пустым) треугольником, стрелка к интерфейсу","Пунктирная линия со стрелкой-зависимостью (open arrowhead)","Сплошная линия с закрашенным ромбом (композиция)"],
 ans:1,
 exp:"Realization (реализация интерфейса) = пунктирная линия + открытый (hollow) треугольник наконечник, направленный ОТ класса К интерфейсу. Сплошная + открытый треугольник = Generalization (наследование). Путаница между Realization и Generalization — одна из самых частых ошибок на собеседованиях."},

{sec:"theory",lab:"Theory — Notation & Concepts",type:"concept",
 q:"В BPMN 2.0 Message Flow (пунктирная линия со стрелкой) может соединять:",
 opts:["Любые элементы внутри одного Pool, включая разные Lanes","Только элементы из РАЗНЫХ Pools (разные участники/организации/системы)","Любые элементы — и внутри Pool, и между Pools","Только Events — не Tasks и не Gateways"],
 ans:1,
 exp:"Message Flow = коммуникация между РАЗНЫМИ Pools (разными участниками). Внутри одного Pool — даже между Lanes — используется только Sequence Flow (сплошная стрелка). Это фундаментальное правило BPMN 2.0, нарушение которого делает модель семантически некорректной."},

// ═══ UML 11-25 ═══
{sec:"uml",lab:"UML — Use Case",type:"choose_diagram",
 q:"Задача: описать, что может делать зарегистрированный пользователь в системе интернет-банка (просмотр баланса, перевод, оплата). Какая UML-диаграмма подходит ЛУЧШЕ ВСЕГО?",
 opts:["Activity Diagram — покажет шаги каждой операции","Use Case Diagram — покажет акторов и доступные функции системы","Class Diagram — покажет сущности банковской системы","State Machine — покажет состояния счёта"],
 ans:1,
 exp:"Use Case Diagram идеален для описания ФУНКЦИОНАЛЬНЫХ ТРЕБОВАНИЙ с точки зрения пользователя. Актор 'Registered User' + Use Cases (View Balance, Transfer Money, Pay Bill). Activity Diagram нужен для описания ПРОЦЕССА выполнения одной операции. Class — для структуры. State Machine — для жизненного цикла объекта."},

{sec:"uml",lab:"UML — Use Case",type:"missing_element",
 q:"В Use Case диаграмме: UseCase 'Login' связан с UseCase '2FA Verification' пунктирной стрелкой. Какой стереотип должен стоять на этой связи?",
 opts:["«extend» — потому что 2FA расширяет Login условно","«include» — потому что Login ВСЕГДА включает 2FA Verification","«generalize» — потому что 2FA является частным случаем Login","Ассоциация без стереотипа"],
 ans:1,
 exp:"«include» — Login ВСЕГДА требует 2FA Verification (обязательный шаг). Стрелка «include» идёт ОТ базового UC (Login) К включаемому (2FA Verify), направление стрелки ОТКРЫТЫМ наконечником указывает к включаемому. «extend» было бы правильным, если бы 2FA была опциональной (например, только для определённых браузеров)."},

{sec:"uml",lab:"UML — Sequence",type:"missing_element",
 q:"На диаграмме ниже: Browser → API GW (POST /login) → AuthService (validateToken()) → API GW ({valid:true}). Что ПРОПУЩЕНО на шаге 4?",
 svg:"seq1",
 opts:["Синхронный вызов от API GW к Browser (новый request)","Return message (пунктирная стрелка) от API GW обратно к Browser с результатом авторизации","Создание нового объекта Session","Асинхронное событие от AuthService к Browser"],
 ans:1,
 exp:"После получения ответа от AuthService, API Gateway должен вернуть результат Browser — это Return Message (пунктирная стрелка с открытым наконечником, - - ▷), например: 200 OK + JWT token. Без этого шага сценарий незавершён. Return messages всегда парные к synchronous calls."},

{sec:"uml",lab:"UML — State Machine",type:"missing_element",
 q:"На диаграмме State Machine заказа (Pending → Paid → Shipped, Cancelled). Что должно быть на пропущенном переходе из Pending в Cancelled?",
 svg:"state1",
 opts:["Guard condition [isPaid = true]","Event 'cancelOrder' (например, пользователь отменил) или timer after(24h) [не оплачен]","Completion transition (автоматический без trigger)","Signal 'paymentFailed' от платёжной системы"],
 ans:1,
 exp:"Переход из Pending в Cancelled может быть вызван двумя типами triggers: 1) Event 'cancelOrder' — явное действие пользователя, 2) Time trigger 'after(24h)' — автоматическая отмена по истечении времени оплаты. Guard [isPaid=true] логически противоречит переходу в Cancelled. Completion transition происходит автоматически после завершения внутренних активностей."},

{sec:"uml",lab:"UML — Activity",type:"choose_diagram",
 q:"На диаграмме ниже изображён процесс обработки заявки. Какой тип UML-диаграммы представлен?",
 svg:"act1",
 opts:["State Machine Diagram — жизненный цикл объекта","Sequence Diagram — взаимодействие объектов во времени","Activity Diagram — поток действий с Decision Node","Use Case Diagram — функции системы"],
 ans:2,
 exp:"На диаграмме: Initial Node (закрашенный круг), Action (прямоугольник 'Submit Request'), Decision Node (ромб с условиями [approved]/[rejected]), два Action'а, Final Node (двойной круг). Это Activity Diagram. State Machine использует состояния с named borders, а не прямоугольные actions. Ромб в Activity = Decision, в State Machine = Choice псевдо-состояние."},

{sec:"uml",lab:"UML — Class",type:"missing_element",
 q:"На Class Diagram: Order (1) — ? — Customer. Customer может иметь много Orders. Что должно стоять вместо «?» (мультиплицированность на стороне Order)?",
 svg:"class1",
 opts:["1 — один заказ на одного клиента","0..* — ноль или более заказов","1..* — один или более заказов","0..1 — ноль или один заказ"],
 ans:1,
 exp:"Customer МОЖЕТ иметь МНОГО заказов (включая 0, если новый клиент ещё ничего не покупал). Значит на стороне Order: 0..* (от нуля до многих). 1 — ошибка, клиент может не иметь заказов. 1..* — ошибка, клиент обязан иметь хотя бы 1 заказ. В UML мультиплицированность читается: один Customer связан с (0..*) Orders."},

{sec:"uml",lab:"UML — Use Case",type:"choose_diagram",
 q:"Бизнес просит показать: как именно происходит процесс оформления заказа — шаг за шагом, с ветками (оплата картой / наличными), параллельными шагами (отправка email и SMS). Какую диаграмму выбрать?",
 opts:["Use Case Diagram — покажет акторов и функции","Activity Diagram — покажет поток шагов с развилками и параллельными ветками","Sequence Diagram — покажет взаимодействие систем при оформлении","Class Diagram — покажет сущности Order, Payment, Customer"],
 ans:1,
 exp:"Activity Diagram — лучший выбор для пошагового описания бизнес-процесса с ветками (Decision) и параллелизмом (Fork/Join). Use Case — для 'ЧТО' делает система, не 'КАК'. Sequence — для взаимодействия компонентов, не для бизнес-логики с ветками. Class — для структуры данных."},

{sec:"uml",lab:"UML — Sequence",type:"read_diagram",
 q:"В Sequence Diagram стрелка пунктирная с ОТКРЫТЫМ наконечником идёт от объекта B к объекту A. Что она означает?",
 opts:["Асинхронный вызов B отправляет сообщение A без ожидания","Return message — возврат результата на синхронный вызов, который A ранее сделал к B","Create message — создание нового объекта A","Destroy message — уничтожение объекта"],
 ans:1,
 exp:"Пунктирная стрелка с открытым (hollow) наконечником = Return Message — ответ на предшествующий synchronous call. Всегда парная: если A вызвал B (solid filled arrow), то B возвращает A пунктирной стрелкой. Async сообщение = solid open arrow. Create = пунктирная к боксу нового объекта. Destroy = X на конце lifeline."},

{sec:"uml",lab:"UML — Class",type:"read_diagram",
 q:"В Class Diagram: сплошная линия с ЗАКРАШЕННЫМ треугольником (▲), стрелка от Dog к Animal. Что это означает?",
 opts:["Реализация интерфейса — Dog implements Animal","Generalization (наследование) — Dog наследует Animal. Стрелка ВСЕГДА от субкласса к суперклассу","Ассоциация — Dog связан с Animal","Зависимость — Dog использует Animal"],
 ans:1,
 exp:"Сплошная линия + закрашенный/открытый треугольник = Generalization (наследование). Направление ВСЕГДА от подкласса к суперклассу (Dog → Animal). Не путай с Realization (пунктирная + треугольник = implements интерфейс). Ромб = Aggregation/Composition. Открытая стрелка = Association. Пунктирная + открытая стрелка = Dependency."},

{sec:"uml",lab:"UML — Class",type:"choose_diagram",
 q:"Нужно показать архитектуру микросервиса: OrderService требует интерфейс IInventory, который реализует InventoryService. Какая нотация ПРАВИЛЬНАЯ для Class/Component диаграммы?",
 opts:["Стрелка Association от OrderService к InventoryService","InventoryService —реализует→ IInventory (Realization); OrderService --зависит-от--> IInventory (Dependency)","Generalization от OrderService к InventoryService","Message Flow от OrderService к InventoryService"],
 ans:1,
 exp:"Правильный паттерн Dependency Inversion: 1) InventoryService реализует IInventory (пунктирная + пустой треугольник). 2) OrderService зависит от IInventory (пунктирная + открытая стрелка). Это показывает что OrderService НЕ знает о InventoryService напрямую — только через интерфейс. Message Flow — это BPMN элемент, не UML."},

{sec:"uml",lab:"UML — Activity",type:"missing_element",
 q:"В Activity Diagram CI/CD пайплайна: после 'Build' → Fork Node → 'Unit Tests' и 'Integration Tests' (параллельно). После обоих тестов перед 'Deploy' должен быть элемент. Какой?",
 opts:["Decision Node (ромб) — для проверки условия прохождения тестов","Join Node (толстая черта) — ждёт завершения ОБОИХ параллельных потоков","Merge Node (ромб) — объединяет альтернативные ветки","Initial Node — перезапускает процесс"],
 ans:1,
 exp:"Join Node (толстая горизонтальная/вертикальная черта) = синхронизатор параллельных потоков. Он ждёт завершения ВСЕХ входящих параллельных потоков перед активацией исходящего. Fork запускает параллельные потоки, Join синхронизирует их. Merge Node работает с АЛЬТЕРНАТИВНЫМИ ветками (после Decision), не с параллельными."},

{sec:"uml",lab:"UML — Sequence",type:"choose_diagram",
 q:"Задача: показать порядок вызовов при авторизации — Browser → API Gateway → AuthService → Database. Какая диаграмма лучше всего подходит?",
 opts:["Class Diagram — покажет связи между компонентами","Sequence Diagram — покажет порядок сообщений между участниками во времени","Activity Diagram — покажет шаги процесса авторизации","State Machine — покажет состояния сессии пользователя"],
 ans:1,
 exp:"Sequence Diagram идеален для показа ПОРЯДКА ВЗАИМОДЕЙСТВИЙ между компонентами/объектами во времени. Lifelines (Browser, API GW, AuthService, DB) + numbered messages + activation boxes. Class Diagram показывает структуру (статику), не поведение. Activity — для бизнес-процессов, не для технических вызовов API."},

{sec:"uml",lab:"UML — Use Case",type:"read_diagram",
 q:"В Use Case диаграмме стрелка <<extend>> идёт от UseCase 'Apply Discount' к UseCase 'Checkout'. Что это означает?",
 opts:["Checkout ВСЕГДА вызывает Apply Discount при оформлении","Apply Discount УСЛОВНО расширяет Checkout — только при наличии промокода или специального условия","Apply Discount наследует поведение от Checkout","Checkout включает Apply Discount как обязательный шаг"],
 ans:1,
 exp:"«extend» = расширяющий UC ('Apply Discount') добавляет поведение к базовому ('Checkout') ТОЛЬКО при выполнении условия (extension point). Стрелка идёт ОТ расширения К базовому UC. Это значит: Checkout работает и без Apply Discount, но в специальных случаях Apply Discount расширяет его поведение."},

{sec:"uml",lab:"UML — Class",type:"draw_diagram",
 q:"Для системы блога нужна Class Diagram. Требования: User создаёт Posts, Post имеет Comments, Comment принадлежит User. Какие мультиплицированности ВЕРНЫ на связи User→Post?",
 opts:["User (1) — (1) Post — один юзер создаёт ровно один пост","User (1) — (0..*) Post — один юзер может иметь ноль или много постов","User (0..*) — (1) Post — много юзеров принадлежат одному посту","User (1..*) — (1..*) Post — много юзеров и много постов"],
 ans:1,
 exp:"User (1) — (0..*) Post: один конкретный User написал от нуля до многих Posts (0 если новый пользователь, * если пишет активно). Читается: '1 User имеет 0..* Posts'. Обратно: каждый Post написан ровно 1 User (не анонимно). User(0..*) — Post(1) было бы ошибочным — оно говорило бы 'Post имеет много User-авторов'."},

{sec:"uml",lab:"UML — Sequence",type:"draw_diagram",
 q:"API call с retry-логикой: Client вызывает Service, Service может вернуть ошибку (до 3 раз), затем успех. Какой Sequence Diagram элемент использовать для моделирования цикла retry?",
 opts:["Alt combined fragment — для альтернативных сценариев","Loop combined fragment с условием [retry < 3 AND error] вокруг блока вызов-ответ","Ref combined fragment — ссылка на другой сценарий","Break combined fragment — для выхода из потока"],
 ans:1,
 exp:"Loop combined fragment (прямоугольник с меткой 'loop' и guard-условием) моделирует повторяющиеся взаимодействия. Синтаксис: loop(min, max) [guard]. В нашем случае: loop(0,3)[error] вокруг пары Client→Service call + Service→Client error response. Alt fragment — для 'if/else' сценариев (например: [success] vs [error]). Break — для досрочного выхода."},

// ═══ BPMN 26-40 ═══
{sec:"bpmn",lab:"BPMN — Process Modeling",type:"choose_diagram",
 q:"Задача: смоделировать бизнес-процесс обработки заявки на кредит с участием трёх отделов (Клиент, Банк, Служба безопасности). Какой инструмент ЛУЧШЕ ВСЕГО подходит?",
 opts:["UML Activity Diagram со Swimlanes","BPMN 2.0 с тремя Pools или Lanes — специально создан для бизнес-процессов с участниками","UML Sequence Diagram с тремя объектами","UML Use Case Diagram с тремя акторами"],
 ans:1,
 exp:"BPMN 2.0 создан именно для этого: Pool = участник процесса (Клиент, Банк, Служба безопасности), Lane = роль/отдел внутри Pool. Ключевые правила из стандарта: Sequence Flow (сплошная) — только ВНУТРИ одного Pool, может свободно пересекать Lane-границы. Message Flow (пунктирная) — ТОЛЬКО между разными Pools. Activity Diagram со Swimlanes технически возможен, но BPMN богаче семантически для бизнес-процессов (типы задач, события, правила потоков)."},

{sec:"bpmn",lab:"BPMN — Gateways",type:"missing_element",
 q:"На диаграмме: после 'Check Stock' поток идёт к шлюзу «?». Из шлюза выходят два пути: [in stock] → 'Confirm Order' и [out of stock] → 'Notify Out of Stock'. Какой Gateway должен быть?",
 svg:"gw1",
 opts:["Parallel Gateway (AND) — активирует ОБА пути одновременно","Exclusive Gateway (XOR) — берёт ОДИН путь на основе условия данных","Inclusive Gateway (OR) — активирует один или несколько путей","Event-Based Gateway — ждёт события"],
 ans:1,
 exp:"Exclusive Gateway (XOR, ромб с X) — идеален для взаимоисключающих условий: товар либо есть, либо нет — не может быть оба пути одновременно. AND Gateway отправил бы поток на ОБА пути, что логически абсурдно. OR Gateway позволил бы несколько путей. Event-Based ждёт события, не условие на данных."},

{sec:"bpmn",lab:"BPMN — Gateways",type:"missing_element",
 q:"На диаграмме: после 'Receive Order' — AND Split → 'Process Payment' и 'Update Inventory' (параллельно). Перед 'Ship Order' стоит шлюз «?». Он должен продолжить процесс только ПОСЛЕ ОБОИХ шагов. Какой Gateway?",
 svg:"par1",
 opts:["Exclusive Gateway (XOR Join) — пропускает первый завершившийся","Parallel Gateway (AND Join) — ждёт ВСЕХ входящих потоков","Inclusive Gateway (OR Join) — ждёт активированных потоков","Event-Based Gateway — ждёт события"],
 ans:1,
 exp:"Parallel Gateway (AND Join, ромб с '+') ждёт ALL токенов со ВСЕХ входящих потоков перед продолжением. Это обязательное правило BPMN: AND Split должен быть сбалансирован AND Join'ом. XOR Join пропустил бы первый завершившийся поток — Ship Order началось бы до оплаты. OR Join работает с потоками, которые были активированы, но не обязательно всеми."},

{sec:"bpmn",lab:"BPMN — Events",type:"read_diagram",
 q:"На диаграмме задача 'Process Payment' имеет на границе пунктирный круг с иконкой таймера, от которого идёт стрелка к 'Send Reminder Email'. Что произойдёт через час?",
 svg:"bound1",
 opts:["Задача 'Process Payment' будет ОТМЕНЕНА и запустится 'Send Reminder Email'","'Send Reminder Email' запустится параллельно, задача 'Process Payment' продолжает выполняться","Процесс полностью остановится и ожидает дальнейших указаний","Поток вернётся в начало процесса"],
 ans:1,
 exp:"DASHED (пунктирный) Boundary Timer Event = Non-Interrupting. Через указанное время запускает ПАРАЛЛЕЛЬНЫЙ путь (напоминание), НЕ прерывая основную задачу. Если бы граница была СПЛОШНОЙ (Interrupting) — Process Payment была бы отменена. Это типичный паттерн напоминания: продолжай платёж, но через час напомни."},

{sec:"bpmn",lab:"BPMN — Events",type:"concept",
 q:"В BPMN 2.0, какой элемент используется для ожидания ОДНОГО из нескольких возможных сообщений (например: или подтверждение оплаты, или отмена от клиента — что придёт первым)?",
 opts:["Parallel Gateway (AND) с двумя Receive Tasks","Event-Based Gateway с двумя catching Message Events","Inclusive Gateway (OR) с двумя Message Events","XOR Gateway с двумя условиями"],
 ans:1,
 exp:"Event-Based Gateway (шестигранник с двойным кругом) создаёт 'race condition' между событиями. После него стоят catching Intermediate Events (Message, Timer и т.д.) — какое событие наступит первым, тот путь и активируется. AND запустил бы ОБА пути. XOR работает с условиями данных, не с событиями."},

{sec:"bpmn",lab:"BPMN — Pools & Lanes",type:"read_diagram",
 q:"На диаграмме два Pool: 'E-Shop' и 'Payment GW'. Между ними пунктирная линия со стрелкой. Что представляет эта связь?",
 svg:"pool1",
 opts:["Sequence Flow — последовательность шагов внутри одного Pool","Message Flow — обмен сообщениями между разными участниками (Pool'ами)","Association — информационная связь без передачи управления","Data Flow — передача данных между системами"],
 ans:1,
 exp:"Пунктирная линия с открытым наконечником между Pools = Message Flow. Это единственный допустимый способ коммуникации между Pool'ами в BPMN 2.0. Sequence Flow (сплошная) НИКОГДА не пересекает границу Pool. Разные Pool = разные участники/организации = обмен сообщениями, а не прямое управление."},

{sec:"bpmn",lab:"BPMN — Tasks",type:"concept",
 q:"Нужно смоделировать задачу, которую выполняет АВТОМАТИЧЕСКИ система (вызов внешнего API). Какой тип Task использовать в BPMN 2.0?",
 opts:["User Task — человек выполняет С поддержкой системы (через UI/BPMS)","Service Task — выполняется автоматически системой, без человека","Manual Task — человек выполняет ВНЕ системы (без BPMS, не отслеживается)","Script Task — встроенный скрипт выполняется автоматически"],
 ans:1,
 exp:"Service Task (⚙️) = автоматическое выполнение системой (вызов API, интеграция, запрос к БД) — человек не участвует. Критическое различие по статье ELMA: User Task = человек + система (BPMS отслеживает выполнение). Manual Task = человек БЕЗ системы (BPMS не управляет и не отслеживает — например, провести совещание, установить оборудование у клиента). Script Task = встроенный код, автоматически, как и Service Task, но без вызова внешнего сервиса."},

{sec:"bpmn",lab:"BPMN — Sub-Processes",type:"concept",
 q:"Процесс 'KYC Verification' используется в 5 разных бизнес-процессах: открытие счёта, кредит, страховка и т.д. Как правильно смоделировать это в BPMN 2.0?",
 opts:["Sub-Process (тонкая рамка) вставить в каждый из 5 процессов с одинаковым содержимым","Call Activity (толстая рамка) в каждом процессе, ссылающийся на один глобальный процесс 'KYC Verification'","Скопировать все шаги KYC напрямую в каждый процесс","Использовать один большой Pool для всех 5 процессов"],
 ans:1,
 exp:"Call Activity — механизм переиспользования в BPMN. Один раз определяешь глобальный процесс 'KYC Verification', и 5 Call Activities ссылаются на него. Изменение KYC применяется автоматически везде. Sub-Process (локальный) в каждом месте — антипаттерн: дублирование, сложность поддержки. Правило: один и тот же процесс в 2+ местах = Call Activity."},

{sec:"bpmn",lab:"BPMN — Error Handling",type:"missing_element",
 q:"В процессе оплаты: если задача 'Charge Card' выбрасывает ошибку 'PaymentFailed', нужно перейти к 'Notify Customer' и завершить. Что нужно добавить на задачу 'Charge Card'?",
 opts:["Non-Interrupting Boundary Timer Event — запустит уведомление параллельно","Interrupting Boundary Error Event — поймает ошибку, отменит задачу, перенаправит к 'Notify Customer'","Intermediate Catch Error Event в потоке после задачи","Error End Event внутри задачи"],
 ans:1,
 exp:"Interrupting Boundary Error Event (СПЛОШНОЙ круг с молнией '!') на задаче: ловит Error с matching error code, ОТМЕНЯЕТ задачу 'Charge Card', перенаправляет поток к обработчику ошибки ('Notify Customer'). Non-Interrupting не подходит — задачу надо остановить при ошибке. Intermediate Catch Event в потоке не ловит ошибки задачи. Error End = бросает ошибку."},

{sec:"bpmn",lab:"BPMN — Process Design",type:"draw_diagram",
 q:"Нужно смоделировать: 'После одобрения заявки система отправляет email И SMS одновременно. Только после получения ОБА подтверждений процесс продолжается.' Какая последовательность BPMN-элементов верна?",
 opts:["XOR Split → Send Email → XOR Join → Send SMS → Continue","AND Split (Parallel GW) → Send Email + Send SMS (параллельно) → AND Join (Parallel GW) → Continue","OR Split → Send Email → OR Join → Continue","Event-Based GW → Send Email → AND Join → Continue"],
 ans:1,
 exp:"AND Split (Parallel GW, ромб с '+') создаёт параллельные токены для обоих путей. Send Email и Send SMS выполняются одновременно. AND Join ждёт ОБА завершения перед продолжением. XOR — только один путь. OR Join ждёт активированных путей. Event-Based — для гонки событий, не для параллельного выполнения."},

{sec:"bpmn",lab:"BPMN — Process Design",type:"choose_diagram",
 q:"Клиент делает заказ на сайте. Требования: показать взаимодействие между Клиентом, Интернет-магазином и Платёжным шлюзом с передачей сообщений между ними. Какой инструмент использовать?",
 opts:["UML Sequence Diagram — лучше показывает порядок вызовов","BPMN с тремя Pool'ами и Message Flow между ними","UML Activity Diagram со Swimlanes","UML Component Diagram — показывает интерфейсы"],
 ans:1,
 exp:"BPMN с тремя Pool (Клиент, Магазин, Платёжный шлюз) + Message Flow = стандарт для межорганизационных/межсистемных бизнес-процессов. В отличие от UML Sequence, BPMN показывает полный бизнес-процесс с событиями, задачами, шлюзами — не только порядок вызовов. Для бизнес-аналитика это более читаемо и ближе к нотации заказчика."},

{sec:"bpmn",lab:"BPMN — Tasks",type:"concept",
 q:"Менеджер проводит встречу с клиентом. Эта встреча происходит вне системы — BPMS не управляет и не отслеживает её выполнение. Какой тип Task использовать?",
 opts:["User Task — человек выполняет задачу через интерфейс BPMS","Manual Task — человек выполняет действие ВНЕ системы, BPMS не отслеживает","Service Task — автоматически выполняется системой","None Task — тип задачи не определён"],
 ans:1,
 exp:"Manual Task (✋) = задача выполняется человеком вне системы, без IT-инструментов. BPMS не управляет ею и не отслеживает факт выполнения. Примеры из статьи ELMA: провести совещание, установить оборудование у клиента, поставить подпись на бумаге. Ключевое отличие от User Task: User Task BPMS выдаёт исполнителю в интерфейсе и отслеживает. Manual Task — это напоминание, что действие вообще должно быть сделано, но система в нём не участвует."},

{sec:"bpmn",lab:"BPMN — Collaboration",type:"read_diagram",
 q:"В BPMN-диаграмме задача находится в Lane 'Credit Department' внутри Pool 'Bank'. К ней подходит Sequence Flow из Lane 'Loan Officer' (того же Pool). Это:",
 opts:["Ошибка — Sequence Flow не может пересекать Lanes","Корректно — Sequence Flow свободно соединяет элементы внутри одного Pool, в том числе через Lane","Нужно заменить на Message Flow","Нужно добавить Gateway между Lanes"],
 ans:1,
 exp:"Sequence Flow (сплошная стрелка) свободно пересекает Lanes внутри одного Pool — это корректно и является стандартной практикой. Lanes — это только визуальное разграничение ответственности (роли/отделы). Message Flow (пунктирная) нужна ТОЛЬКО между разными Pool. Добавлять Gateway между Lanes не требуется."},

{sec:"bpmn",lab:"BPMN — Process Design",type:"draw_diagram",
 q:"Onboarding-процесс: после регистрации нужно выполнить три шага по порядку — Verify Email → Setup Profile → Activate Account. Если на ЛЮБОМ шаге ошибка — весь процесс завершается с Error End Event. Какой паттерн ВЕРНЫЙ?",
 opts:["Три задачи последовательно через XOR Gateway (с условием ошибки)","Три задачи последовательно (Sequence Flow). Каждая имеет Interrupting Boundary Error Event → Error End Event. Если ошибок нет — финальный None End Event","Sub-Process с Loop marker, включающий все три шага","AND Split → три задачи параллельно → AND Join"],
 ans:1,
 exp:"Для линейного процесса с обработкой ошибок: три задачи последовательно через Sequence Flow. На каждой — Interrupting Boundary Error Event, ведущий к Error End Event (или общему Error End). Если ошибок нет — поток доходит до None End Event. XOR Gateway для ошибок — неправильно (условие данных, не event). Параллельный AND — не подходит, шаги должны идти по порядку."},

{sec:"bpmn",lab:"BPMN — Advanced",type:"choose_diagram",
 q:"Нужно описать: 'Каждые понедельник в 9:00 система автоматически запускает процесс формирования отчёта.' Какой BPMN Start Event использовать?",
 opts:["None Start Event — простой запуск","Message Start Event — ждёт входящего сообщения","Timer Start Event — запускает процесс по расписанию","Signal Start Event — реагирует на broadcast-сигнал"],
 ans:2,
 exp:"Timer Start Event (круг с иконкой часов) — запускает процесс по расписанию (cron-выражение, конкретная дата/время, интервал). Именно для 'каждый понедельник в 9:00'. Message Start — ждёт входящего сообщения от другого Pool. Signal Start — реагирует на broadcast-сигнал от любого участника. None Start — ручной запуск или вызов."}

function bpEsc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function bpNodesOf(ex){
  return ex.correctOrder.map(function(id){
    var p = ex.pool.filter(function(x){return x.id===id;})[0];
    return {id:p.id, m:p.meta};
  });
}

function bpFlowShape(m,cx,cy,compact){
  var fs = compact?8:10;
  if(m.kind==='start') return '<circle cx="'+cx+'" cy="'+cy+'" r="12" fill="#3b82f6"/><text x="'+cx+'" y="'+(cy+(compact?26:0))+'" text-anchor="middle" fill="#93c5fd" font-size="'+fs+'"'+(compact?'':' dx="26" style="text-anchor:start"')+'>'+bpEsc(m.text)+'</text>';
  if(m.kind==='end') return '<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="none" stroke="#ef4444" stroke-width="2"/><circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#ef4444"/><text x="'+cx+'" y="'+(cy+(compact?28:0))+'" text-anchor="middle" fill="#fca5a5" font-size="'+fs+'"'+(compact?'':' dx="28" style="text-anchor:start"')+'>'+bpEsc(m.text)+'</text>';
  var bw = compact?128:168, bh=30;
  if(m.kind==='task') return '<rect x="'+(cx-bw/2)+'" y="'+(cy-bh/2)+'" width="'+bw+'" height="'+bh+'" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.4"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="#93c5fd" font-size="'+fs+'">'+bpEsc(m.text)+'</text>';
  if(m.kind==='send') return '<rect x="'+(cx-bw/2)+'" y="'+(cy-bh/2)+'" width="'+bw+'" height="'+bh+'" rx="12" fill="#0d3b2e" stroke="#10b981" stroke-width="1.4" stroke-dasharray="5,2"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="#6ee7b7" font-size="'+fs+'">✉ '+bpEsc(m.text)+'</text>';
  if(m.kind==='gateway_x') return '<polygon points="'+cx+','+(cy-18)+' '+(cx+18)+','+cy+' '+cx+','+(cy+18)+' '+(cx-18)+','+cy+'" fill="#1a1f2e" stroke="#f59e0b" stroke-width="1.5"/><text x="'+cx+'" y="'+(cy+32)+'" text-anchor="middle" fill="#fcd34d" font-size="'+fs+'">'+bpEsc(m.text)+'</text>';
  if(m.kind==='fork'||m.kind==='join') return '<rect x="'+(cx-30)+'" y="'+(cy-5)+'" width="60" height="10" fill="#94a3b8"/><text x="'+cx+'" y="'+(cy-12)+'" text-anchor="middle" fill="#64748b" font-size="8">'+(m.kind==='fork'?'Fork':'Join')+'</text>';
  return '';
}

function bpLine(x1,y1,x2,y2,marker){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#'+(marker||'ffA')+')"/>';}

function renderFinalLinearFlow(nodes){
  var rowH=68, w=380, cy0=32;
  var h=cy0+(nodes.length-1)*rowH+40;
  var svg='<svg viewBox="0 0 '+w+' '+h+'" width="360" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><marker id="ffA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#94a3b8"/></marker></defs>';
  var ys=[];
  nodes.forEach(function(n,i){ys.push(cy0+i*rowH);});
  nodes.forEach(function(n,i){
    if(i>0) svg+=bpLine(190,ys[i-1]+18,190,ys[i]-18);
    svg+=bpFlowShape(n.m,190,ys[i]);
  });
  svg+='</svg>';
  return svg;
}

function renderFinalForkJoin(nodes,forkIdx,joinIdx){
  var rowH=68, cx=190, w=380, y=32;
  var parts=[], positions=[];
  for(var i=0;i<=forkIdx;i++){
    positions[i]={x:cx,y:y};
    if(i>0) parts.push(bpLine(cx,positions[i-1].y+18,cx,y-18));
    parts.push(bpFlowShape(nodes[i].m,cx,y));
    y+=rowH;
  }
  var branchCount=joinIdx-forkIdx-1, spacing=140;
  var startX=cx-((branchCount-1)*spacing)/2, branchY=y;
  for(var k=0;k<branchCount;k++){
    var idx=forkIdx+1+k, bx=startX+k*spacing;
    positions[idx]={x:bx,y:branchY};
    parts.push(bpLine(cx,positions[forkIdx].y+6,bx,branchY-16));
    parts.push(bpFlowShape(nodes[idx].m,bx,branchY));
  }
  y=branchY+rowH;
  positions[joinIdx]={x:cx,y:y};
  for(var k2=0;k2<branchCount;k2++){
    var idx2=forkIdx+1+k2;
    parts.push(bpLine(positions[idx2].x,positions[idx2].y+16,cx,y-6));
  }
  parts.push(bpFlowShape(nodes[joinIdx].m,cx,y));
  y+=rowH;
  for(var j=joinIdx+1;j<nodes.length;j++){
    positions[j]={x:cx,y:y};
    parts.push(bpLine(cx,positions[j-1].y+18,cx,y-18));
    parts.push(bpFlowShape(nodes[j].m,cx,y));
    y+=rowH;
  }
  var totalH=y+10;
  return '<svg viewBox="0 0 '+w+' '+totalH+'" width="360" height="'+totalH+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><marker id="ffA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#94a3b8"/></marker></defs>'
    +parts.join('')+'</svg>';
}

function renderFinalSwimlane(nodes){
  var pools=[], lanes=[], real=[];
  nodes.forEach(function(n){
    if(n.m.kind==='pool') pools.push(n.m.text);
    else if(n.m.kind==='lane') lanes.push({name:n.m.text,pool:n.m.pool});
    else real.push(n);
  });
  var rows=[];
  pools.forEach(function(p){
    var poolLanes=lanes.filter(function(l){return l.pool===p;});
    if(poolLanes.length===0) rows.push({label:p,pool:p});
    else poolLanes.forEach(function(l){rows.push({label:l.name,pool:p});});
  });
  function rowIndexFor(n){
    for(var i=0;i<rows.length;i++) if(rows[i].label===n.m.lane) return i;
    return 0;
  }
  var rowH=90, colW=155, leftPad=100;
  var maxCols=1, colCounters={};
  rows.forEach(function(r,i){colCounters[i]=0;});
  var placedPos=[];
  real.forEach(function(n){
    var ri=rowIndexFor(n), ci=colCounters[ri]++;
    if(ci+1>maxCols) maxCols=ci+1;
    placedPos.push({x:leftPad+50+ci*colW,y:40+ri*rowH+rowH/2,row:ri});
  });
  var w=leftPad+50+maxCols*colW+30, totalH=40+rows.length*rowH+15;
  var svg='<svg viewBox="0 0 '+w+' '+totalH+'" width="500" height="'+totalH+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><marker id="ffA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#94a3b8"/></marker>'
    +'<marker id="ffB" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="none" stroke="#10b981" stroke-width="1.3"/></marker></defs>';
  rows.forEach(function(r,i){
    var y=40+i*rowH;
    svg+='<rect x="'+leftPad+'" y="'+y+'" width="'+(w-leftPad-15)+'" height="'+rowH+'" fill="'+(i%2===0?'#12161f':'#0d1117')+'" stroke="#2d3748" stroke-width="1"/>';
    svg+='<text x="'+(leftPad-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" fill="#64748b" font-size="9">'+bpEsc(r.pool)+(r.label!==r.pool?' / '+bpEsc(r.label):'')+'</text>';
  });
  for(var i=1;i<real.length;i++){
    var dashed = real[i-1].m.pool!==real[i].m.pool;
    var p1=placedPos[i-1], p2=placedPos[i];
    svg+='<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="'+(dashed?'#10b981':'#94a3b8')+'" stroke-width="1.5"'+(dashed?' stroke-dasharray="5,3" marker-end="url(#ffB)"':' marker-end="url(#ffA)"')+'/>';
  }
  real.forEach(function(n,i){ svg+=bpFlowShape(n.m,placedPos[i].x,placedPos[i].y,true); });
  svg+='</svg>';
  return svg;
}

function renderFinalFlow(ex){
  var nodes=bpNodesOf(ex);
  if(nodes.some(function(n){return n.m.kind==='pool'||n.m.kind==='lane';})) return renderFinalSwimlane(nodes);
  var forkIdx=-1,joinIdx=-1;
  nodes.forEach(function(n,i){if(n.m.kind==='fork')forkIdx=i;if(n.m.kind==='join')joinIdx=i;});
  if(forkIdx!==-1&&joinIdx!==-1&&joinIdx>forkIdx+1) return renderFinalForkJoin(nodes,forkIdx,joinIdx);
  return renderFinalLinearFlow(nodes);
}

function renderFinalSequence(ex){
  var msgs=ex.correctOrder.map(function(id){return ex.pool.filter(function(p){return p.id===id;})[0].meta;});
  var actors=[];
  msgs.forEach(function(m){if(actors.indexOf(m.from)===-1)actors.push(m.from);if(actors.indexOf(m.to)===-1)actors.push(m.to);});
  var colW=125, leftPad=65, w=leftPad+(actors.length-1)*colW+70;
  var rowH=40, topPad=48, h=topPad+msgs.length*rowH+25;
  function xFor(name){return leftPad+actors.indexOf(name)*colW;}
  var svg='<svg viewBox="0 0 '+w+' '+h+'" width="440" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><marker id="sqA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#3b82f6"/></marker>'
    +'<marker id="sqB" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="none" stroke="#10b981" stroke-width="1.3"/></marker>'
    +'<marker id="sqC" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#64748b"/></marker></defs>';
  actors.forEach(function(a){
    var x=xFor(a);
    svg+='<rect x="'+(x-42)+'" y="12" width="84" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.3"/>'
      +'<text x="'+x+'" y="27" text-anchor="middle" fill="#93c5fd" font-size="8">'+bpEsc(a)+'</text>'
      +'<line x1="'+x+'" y1="34" x2="'+x+'" y2="'+(h-8)+'" stroke="#2d3748" stroke-width="1" stroke-dasharray="4,3"/>';
  });
  msgs.forEach(function(m,i){
    var y=topPad+i*rowH, x1=xFor(m.from), x2=xFor(m.to);
    var isReturn=m.style==='return', isAsync=m.style==='async';
    var stroke=isReturn?'#64748b':(isAsync?'#10b981':'#3b82f6');
    var marker=isReturn?'url(#sqC)':(isAsync?'url(#sqB)':'url(#sqA)');
    var dash=isReturn?' stroke-dasharray="5,3"':'';
    svg+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+stroke+'" stroke-width="1.6"'+dash+' marker-end="'+marker+'"/>';
    svg+='<text x="'+((x1+x2)/2)+'" y="'+(y-5)+'" text-anchor="middle" fill="#cbd5e1" font-size="7.5">'+bpEsc(m.text)+'</text>';
  });
  svg+='</svg>';
  return svg;
}

function renderFinalGraph(ex){
  var items=bpNodesOf(ex);
  var nodesArr=items.filter(function(it){return ['class','interface','actor','usecase'].indexOf(it.m.kind)!==-1;});
  var edgesArr=items.filter(function(it){return ['assoc','generalization','realization','composition','aggregation','include','extend'].indexOf(it.m.kind)!==-1;});
  var colW=135, topPad=45, w=Math.max(380,nodesArr.length*colW+40);
  var pos={};
  nodesArr.forEach(function(n,i){
    var bottom=topPad+(n.m.kind==='actor'?44:22);
    pos[n.id]={x:40+i*colW+colW/2,y:topPad,bottom:bottom};
  });
  var h=topPad+150;
  var svg='<svg viewBox="0 0 '+w+' '+h+'" width="'+Math.min(460,w)+'" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><marker id="gA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="none" stroke="#94a3b8" stroke-width="1.3"/></marker>'
    +'<marker id="gInc" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#94a3b8"/></marker></defs>';
  edgesArr.forEach(function(e,idx){
    var p1=pos[e.m.from], p2=pos[e.m.to];
    if(!p1||!p2) return;
    var y1=p1.bottom+idx*4, y2=p2.bottom+idx*4;
    var dash=(e.m.kind==='realization'||e.m.kind==='include'||e.m.kind==='extend')?' stroke-dasharray="5,3"':'';
    var marker=(e.m.kind==='include'||e.m.kind==='extend')?'url(#gInc)':'url(#gA)';
    svg+='<line x1="'+p1.x+'" y1="'+y1+'" x2="'+p2.x+'" y2="'+y2+'" stroke="#94a3b8" stroke-width="1.4"'+dash+' marker-end="'+marker+'"/>';
    var lbl=e.m.kind==='include'?'«include»':e.m.kind==='extend'?'«extend»':e.m.kind==='realization'?'«realize»':e.m.kind==='composition'?'◆ comp.':e.m.kind==='aggregation'?'◇ aggr.':'';
    if(lbl) svg+='<text x="'+((p1.x+p2.x)/2)+'" y="'+(Math.max(y1,y2)+13)+'" text-anchor="middle" fill="#64748b" font-size="7.5">'+lbl+'</text>';
  });
  nodesArr.forEach(function(n){
    var p=pos[n.id];
    if(n.m.kind==='actor'){
      svg+='<circle cx="'+p.x+'" cy="'+(p.y-6)+'" r="7" fill="none" stroke="#94a3b8" stroke-width="1.3"/>'
        +'<line x1="'+p.x+'" y1="1" x2="'+p.x+'" y2="16" stroke="#94a3b8" stroke-width="1.3" transform="translate(0,'+p.y+')"/>'
        +'<line x1="'+(p.x-8)+'" y1="6" x2="'+(p.x+8)+'" y2="6" stroke="#94a3b8" stroke-width="1.3" transform="translate(0,'+p.y+')"/>'
        +'<line x1="'+p.x+'" y1="16" x2="'+(p.x-7)+'" y2="28" stroke="#94a3b8" stroke-width="1.3" transform="translate(0,'+p.y+')"/>'
        +'<line x1="'+p.x+'" y1="16" x2="'+(p.x+7)+'" y2="28" stroke="#94a3b8" stroke-width="1.3" transform="translate(0,'+p.y+')"/>'
        +'<text x="'+p.x+'" y="'+(p.y+42)+'" text-anchor="middle" fill="#93c5fd" font-size="8">'+bpEsc(n.m.text)+'</text>';
    } else if(n.m.kind==='usecase'){
      svg+='<ellipse cx="'+p.x+'" cy="'+p.y+'" rx="58" ry="20" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.4"/>'
        +'<text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" fill="#93c5fd" font-size="8">'+bpEsc(n.m.text)+'</text>';
    } else {
      svg+='<rect x="'+(p.x-55)+'" y="'+(p.y-16)+'" width="110" height="32" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.4"/>'
        +(n.m.kind==='interface'?'<text x="'+p.x+'" y="'+(p.y-4)+'" text-anchor="middle" fill="#64748b" font-size="7">«interface»</text>':'')
        +'<text x="'+p.x+'" y="'+(p.y+(n.m.kind==='interface'?10:4))+'" text-anchor="middle" fill="#93c5fd" font-size="8">'+bpEsc(n.m.text)+'</text>';
    }
  });
  svg+='</svg>';
  return svg;
}

function renderFinalDiagram(ex){
  if(ex.type==='bpmn'||ex.type==='activity') return renderFinalFlow(ex);
  if(ex.type==='sequence') return renderFinalSequence(ex);
  if(ex.type==='class'||ex.type==='usecase') return renderFinalGraph(ex);
  return '';
}

var bpState = {typeId:null, exId:null, placed:[], mistakes:0, wrongId:null, done:false};

function renderBuildPractice(){
  if(!bpState.typeId) return renderBuildTypeSelector();
  if(!bpState.exId) return renderBuildExList();
  return renderBuildExercise();
}

function renderBuildTypeSelector(){
  var html = '<div class="t-h3">🎨 Практика: Построй диаграмму</div>'
    +'<div class="info-box">Дано условие задачи. Кликай подготовленные элементы В ПРАВИЛЬНОМ ПОРЯДКЕ, чтобы построить диаграмму. Часть элементов — «отвлекающие» (лишние или из другой ветки) — их использовать не нужно.</div>'
    +'<div class="build-type-grid">';
  BUILD_TYPES.forEach(function(t){
    var cnt = BUILD_EXERCISES.filter(function(e){return e.type===t.id;}).length;
    html += '<div class="build-type-card" onclick="selectBuildType(\''+t.id+'\')">'
      +'<div class="bt-icon">'+t.icon+'</div><h4>'+t.label+'</h4><p>'+t.desc+' · '+cnt+' задания</p></div>';
  });
  html += '</div>';
  return html;
}

function renderBuildExList(){
  var exs = BUILD_EXERCISES.filter(function(e){return e.type===bpState.typeId;});
  var typeInfo = BUILD_TYPES.filter(function(t){return t.id===bpState.typeId;})[0];
  var html = '<div class="t-h3">'+typeInfo.icon+' '+typeInfo.label+' — выбери задание</div>'
    +'<div class="build-ex-list">';
  exs.forEach(function(e){
    html += '<div class="build-ex-card" onclick="startBuildEx(\''+e.id+'\')"><h4>'+e.title+'</h4><p>'+e.scenario.slice(0,90)+'…</p></div>';
  });
  html += '</div><button class="btn btn-g" onclick="backToBuildTypes()">← Назад к выбору диаграммы</button>';
  return html;
}

function renderBuildExercise(){
  var ex = BUILD_EXERCISES.filter(function(e){return e.id===bpState.exId;})[0];
  var html = '<div class="t-h3">'+ex.title+'</div>'
    +'<div class="build-scenario">📌 '+ex.scenario+'</div>'
    +'<div class="build-progress">Шаг '+bpState.placed.length+' из '+ex.correctOrder.length+' · Ошибок: '+bpState.mistakes+'</div>';

  if(!bpState.done){
    html += '<div class="build-canvas">';
    if(bpState.placed.length===0){
      html += '<div class="build-canvas-empty">Диаграмма пока пуста — кликай элементы ниже по порядку</div>';
    } else {
      bpState.placed.forEach(function(elId,i){
        var el = ex.pool.filter(function(p){return p.id===elId;})[0];
        html += '<div class="build-placed"><span class="build-placed-badge">'+(i+1)+'. '+el.label+'</span></div>';
        if(i<bpState.placed.length-1) html += '<div class="build-arrow-down">↓</div>';
      });
    }
    html += '</div>';
  }

  if(bpState.done){
    var pct = bpState.mistakes===0?'perfect':bpState.mistakes<=2?'good':'rough';
    var title = pct==='perfect'?'🏆 Идеально! Без единой ошибки':pct==='good'?'✅ Хорошо, диаграмма построена':'📚 Построено, но стоит повторить теорию';
    html += '<div class="build-done-banner '+pct+'"><h3>'+title+'</h3><p>Ошибок при построении: '+bpState.mistakes+'</p></div>'
      +'<div class="build-final-diagram">'+renderFinalDiagram(ex)+'</div>'
      +'<div class="build-explanation"><b>Разбор:</b> '+ex.explanation+'</div>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-p" onclick="retryBuildEx()">🔄 Повторить</button><button class="btn btn-g" onclick="backToBuildExList()">📋 Другое задание</button></div>';
  } else {
    html += '<div class="build-pool">';
    ex.pool.forEach(function(el){
      var used = bpState.placed.indexOf(el.id)!==-1;
      var wrong = bpState.wrongId===el.id;
      var cls = 'build-el'+(used?' used':'')+(wrong?' wrong':'');
      html += '<div class="'+cls+'" onclick="clickBuildEl(\''+el.id+'\')">'+el.label+'</div>';
    });
    html += '</div>'
      +'<button class="btn btn-g" onclick="backToBuildExList()">← Другое задание</button>';
  }
  return html;
}

function selectBuildType(id){bpState.typeId=id;bpState.exId=null;refreshBuildPanel();}
function backToBuildTypes(){bpState.typeId=null;bpState.exId=null;refreshBuildPanel();}
function backToBuildExList(){bpState.exId=null;bpState.placed=[];bpState.mistakes=0;bpState.wrongId=null;bpState.done=false;refreshBuildPanel();}
function retryBuildEx(){bpState.placed=[];bpState.mistakes=0;bpState.wrongId=null;bpState.done=false;refreshBuildPanel();}

function startBuildEx(id){
  bpState.exId=id;bpState.placed=[];bpState.mistakes=0;bpState.wrongId=null;bpState.done=false;
  refreshBuildPanel();
}

function clickBuildEl(elId){
  var ex = BUILD_EXERCISES.filter(function(e){return e.id===bpState.exId;})[0];
  if(bpState.placed.indexOf(elId)!==-1) return;
  var expected = ex.correctOrder[bpState.placed.length];
  if(elId===expected){
    bpState.placed.push(elId);
    if(bpState.placed.length===ex.correctOrder.length) bpState.done=true;
    refreshBuildPanel();
  } else {
    bpState.mistakes++;
    bpState.wrongId=elId;
    refreshBuildPanel();
    setTimeout(function(){bpState.wrongId=null;refreshBuildPanel();},450);
  }
}

function refreshBuildPanel(){
  var el = document.getElementById('utp');
  if(el) el.innerHTML = renderBuildPractice();
}

function typeLabel(t){return{concept:'Concept',choose_diagram:'Choose Diagram',missing_element:'Missing Element',read_diagram:'Read Diagram',draw_diagram:'Draw / Design'}[t]||t;}

  var tabs = [
    {id:'overview',label:'📊 Diagram Types'},

function switchTabUML(id){
  theoryTabUML = id;
  renderTheoryUML();
}

function startQuizUML(){
  stateUML = 'quiz';
  curUML = 0;
  renderQUML();
}

// ─── QUIZ SCREEN ───
function renderDotsUML(){
  var h = '';
  for(var i=0;i<67;i++){
    var c='dot';
    if(i===curUML) c+=' cur';
    else if(resultsUML[i]===true) c+=' ok';
    else if(resultsUML[i]===false) c+=' fail';
    h+='<div class="'+c+'" onclick="goToUML('+i+')">'+(i+1)+'</div>';
  }
  return h;
}

function renderQUML(){
  if(curUML>=Q_UML.length){renderScoreUML();return;}
  var q = Q_UML[curUML];
  var done = resultsUML[curUML]!==null;
  var sel  = chosenUML[curUML];
  var keys = ['A','B','C','D'];

  document.getElementById('uplabel').textContent = 'Question '+(curUML+1)+' of 67';
  document.getElementById('upscore').textContent  = 'Score: '+scoreUML;
  document.getElementById('upfill').style.width   = (((curUML+1)/67)*100).toFixed(0)+'%';

  var optsHtml = '';
  for(var i=0;i<q.opts.length;i++){
    var c='opt';
    if(done){
      c+=' dis';
      if(i===q.ans) c+=' correct';
      else if(i===sel&&sel!==q.ans) c+=' wrong';
    } else {
      if(i===sel) c+=' sel';
    }
    optsHtml+='<div class="'+c+'" onclick="pickUML('+i+')">'
      +'<span class="okey">'+keys[i]+'</span>'+q.opts[i]+'</div>';
  }

  var fbCls = done?(resultsUML[curUML]?'fb ok show':'fb fail show'):'fb';
  var fbTxt = '';
  if(done) fbTxt=(resultsUML[curUML]?'✅ Верно! ':'❌ Неверно. ')+'<strong>Объяснение:</strong> '+q.exp;

  var diag = (q.svg&&SVGS_UML[q.svg])?'<div class="diagram">'+SVGS_UML[q.svg]+'</div>':'';

  var submitBtn = (!done&&sel!==null)?'<button class="btn btn-p" onclick="submitUML()">Подтвердить ответ</button>':'';
  var nextBtn   = done?'<button class="btn btn-p" onclick="nxtUML()">'+(curUML===Q_UML.length-1?'Результаты →':'Далее →')+'</button>':'';
  var theoryBtn = '<button class="btn btn-g" onclick="backToTheoryUML()">📚 Теория</button>';

  document.getElementById('uapp').innerHTML =
    '<div class="dots">'+renderDotsUML()+'</div>'+
    '<span class="sec-label '+secClass(q.sec)+'">'+q.lab+'</span>'+
    '<span class="q-type">'+typeLabel(q.type)+'</span>'+
    '<div class="card">'+
      '<div class="qnum">Вопрос '+(curUML+1)+' / 67</div>'+
      '<div class="qtext">'+q.q+'</div>'+
      diag+
      '<div class="options">'+optsHtml+'</div>'+
      '<div class="'+fbCls+'">'+fbTxt+'</div>'+
    '</div>'+
    '<div class="nav">'+
      '<div style="display:flex;gap:8px">'+
        '<button class="btn btn-g" onclick="prvUML()" '+(curUML===0?'disabled':'')+'>← Назад</button>'+
        theoryBtn+
      '</div>'+
      '<div style="display:flex;gap:8px">'+submitBtn+nextBtn+'</div>'+
    '</div>';
}

function pickUML(i){if(resultsUML[curUML]!==null)return;chosenUML[curUML]=i;renderQUML();}
function submitUML(){
  if(chosenUML[curUML]===null)return;
  var ok=chosenUML[curUML]===Q_UML[curUML].ans;
  resultsUML[curUML]=ok;
  if(ok)scoreUML++;
  renderQUML();
}
function nxtUML(){if(curUML<Q_UML.length-1){curUML++;renderQUML();}else{renderScoreUML();}}
function prvUML(){if(curUML>0){curUML--;renderQUML();}}
function goToUML(i){curUML=i;renderQUML();}
function backToTheoryUML(){stateUML='theory';renderTheoryUML();}

// ─── SCORE SCREEN ───
function renderScoreUML(){
  var th=0,ul=0,bp=0,thT=0,ulT=0,bpT=0;
  for(var i=0;i<Q_UML.length;i++){
    var s=Q_UML[i].sec;
    if(s==='theory'){thT++;if(resultsUML[i]===true)th++;}
    else if(s==='uml'){ulT++;if(resultsUML[i]===true)ul++;}
    else if(s==='bpmn'){bpT++;if(resultsUML[i]===true)bp++;}
  }
  var total=th+ul+bp;
  var grandTotal=Q_UML.length;
  var pct=Math.round(total/grandTotal*100);
  var grade=pct>=90?'🏆 Expert':pct>=75?'⭐ Advanced':pct>=60?'✅ Proficient':'📚 Keep Practicing';

  document.getElementById('upfill').style.width='100%';
  document.getElementById('uplabel').textContent='Тест завершён!';
  document.getElementById('upscore').textContent='Итог: '+total+'/'+grandTotal+' ('+pct+'%)';

  // per-type breakdown
  var types=['concept','choose_diagram','missing_element','read_diagram','draw_diagram'];
  var typeNames={'concept':'Concept','choose_diagram':'Choose Diagram','missing_element':'Missing Element','read_diagram':'Read Diagram','draw_diagram':'Draw / Design'};
  var typeScore={};
  var typeTotal={};
  types.forEach(function(t){typeScore[t]=0;typeTotal[t]=0;});
  for(var i=0;i<Q_UML.length;i++){
    var t=Q_UML[i].type;
    if(typeTotal[t]===undefined){typeTotal[t]=0;typeScore[t]=0;types.push(t);}
    typeTotal[t]++;
    if(resultsUML[i]===true) typeScore[t]++;
  }
  var typeHtml='';
  types.forEach(function(t){
    if(typeTotal[t]>0){
      var p=Math.round(typeScore[t]/typeTotal[t]*100);
      var col=p>=80?'#6ee7b7':p>=60?'#f59e0b':'#fca5a5';
      typeHtml+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #2d3748">'
        +'<span style="font-size:0.83rem;color:#94a3b8">'+(typeNames[t]||t)+'</span>'
        +'<span style="font-size:0.83rem;font-weight:700;color:'+col+'">'+typeScore[t]+'/'+typeTotal[t]+'</span>'
        +'</div>';
    }
  });

  document.getElementById('uapp').innerHTML=
    '<div class="score-wrap">'+
      '<div class="score-big">'+total+'/'+grandTotal+'</div>'+
      '<div class="score-sub">'+grade+' · '+pct+'%</div>'+
      '<div class="score-grid">'+
        '<div class="score-box t"><h3>Theory</h3><div class="n">'+th+'/'+thT+'</div></div>'+
        '<div class="score-box u"><h3>UML</h3><div class="n">'+ul+'/'+ulT+'</div></div>'+
        '<div class="score-box b"><h3>BPMN</h3><div class="n">'+bp+'/'+bpT+'</div></div>'+
      '</div>'+
      '<div style="max-width:340px;margin:0 auto 24px;background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:14px">'+
        '<div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:4px">By Question Type</div>'+
        typeHtml+
      '</div>'+
      '<div style="display:flex;gap:10px;justify-content:center">'+
        '<button class="btn btn-p" onclick="restartUML()">🔄 Пройти заново</button>'+
        '<button class="btn btn-g" onclick="goToUML(0);state=\'quiz\';renderQUML()">📋 Просмотр ответов</button>'+
        '<button class="btn btn-g" onclick="backToTheoryUML()">📚 Теория</button>'+
      '</div>'+
    '</div>';
}

function restartUML(){
  curUML=0;scoreUML=0;
  resultsUML=new Array(67).fill(null);
  chosenUML=new Array(67).fill(null);
  stateUML='quiz';
  renderQUML();
}

Q_UML.push({sec:"uml",lab:"UML — Чтение диаграмм",type:"read_diagram",

Q_UML.push({sec:"uml",lab:"UML — Чтение диаграмм",type:"read_diagram",

Q_UML.push({sec:"bpmn",lab:"BPMN — Чтение диаграмм",type:"read_diagram",

Q_UML.push({sec:"uml",lab:"UML — Чтение диаграмм",type:"read_diagram",
 q:"На Class Diagram: Order связан с Customer стрелкой с ОТКРЫТЫМ наконечником (→), с OrderItem — линией с ЗАКРАШЕННЫМ ромбом (◆), с IPayable — пунктирной стрелкой и ОТКРЫТЫМ треугольником (- - -▷). Определи все три типа связей.",
 svg:"dr5",
 opts:[

  "Order → Customer: ассоциация (1 заказ у 1..* Customer); Order ◆ OrderItem: композиция (OrderItem не существует без Order); Order ---▷ IPayable: реализация интерфейса",
  "Order → Customer: ассоциация; Order ◆ OrderItem: агрегация (пустой ромб); Order ---▷ IPayable: зависимость",
  "Все три стрелки — разные виды наследования в UML"
 ],
 ans:1,
 exp:"3 разные связи: 1) Открытая стрелка (→) = Ассоциация. Order связан с Customer, множественность 1 к 1..*. 2) Закрашенный ромб (◆) = Композиция — сильное владение: OrderItem не существует без Order, при удалении Order удаляются OrderItems. Пустой ромб = Агрегация (слабое владение). 3) Пунктирная + открытый треугольник = Реализация (Realization) — Order implements IPayable. Сплошная + треугольник = Generalization (наследование)."});

Q_UML.push({sec:"bpmn",lab:"BPMN — Gateway / Шлюзы",type:"concept",

Q_UML.push({sec:"bpmn",lab:"BPMN — Gateway / Шлюзы",type:"concept",

  "Используется только для остановки процесса"
 ],
 ans:1,
 exp:"Parallel Gateway / Оператор И: при разделении (split) — ВСЕ исходящие ветви активируются ОДНОВРЕМЕННО (параллельное выполнение). При синхронизации (join/слиянии) — оператор ждёт завершения ВСЕХ входящих ветвей, и только потом активирует исходящий поток. Это правило строгое: дисбаланс AND Split/Join (например split на 3 ветви, а join ждёт только 2) — ошибка модели."});

Q_UML.push({sec:"bpmn",lab:"BPMN — Gateway / Шлюзы",type:"concept",
