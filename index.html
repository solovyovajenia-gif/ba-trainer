<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BA & Diagrams Trainer</title>
<link rel="stylesheet" href="styles.css?v=202611171516">
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger" onclick="sbToggle()" aria-label="Menu">☰</button>
  <div class="brand"><span class="brand-logo">BA</span><span class="brand-name" data-i18n="brand">BA Trainer</span></div>
  <div class="topbar-right">
    <div class="lang-toggle" id="lang-switch" title="Язык / Language"><button data-lang="ru" onclick="setLang('ru')">RU</button><button data-lang="en" onclick="setLang('en')">EN</button></div>
  </div>
</header>
<div class="content-notice" id="content-notice" style="display:none"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="sb-backdrop" id="sb-backdrop" onclick="sbClose()"></div>
  <main class="content">
    <div class="pg">
      <div class="pg-meta"><span id="plabel"></span><span id="pscore"></span></div>
      <div class="pg-bg"><div class="pg-fill" id="pfill" style="width:0%"></div></div>
    </div>
    <div class="main" id="app"></div>
  </main>
</div>

<script src="i18n.js?v=202611171516"></script>
<script src="data.ru.js?v=202611171516"></script>
<script src="data.en.js?v=202611171516"></script>
<script src="app.js?v=202611171516"></script>
<script>applyStaticI18n();</script>
</body>
</html>
