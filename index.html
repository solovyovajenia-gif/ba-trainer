<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
.hdr{background:#1a1f2e;padding:14px 24px;border-bottom:1px solid #2d3748;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:1.1rem;font-weight:700;color:#fff}

.b1{background:#1e3a5f;color:#93c5fd}.b2{background:#064e3b;color:#6ee7b7}
.pg{background:#1a1f2e;padding:9px 24px;border-bottom:1px solid #2d3748}
.pg-meta{display:flex;justify-content:space-between;font-size:0.76rem;color:#94a3b8;margin-bottom:5px}
.pg-bg{background:#2d3748;border-radius:4px;height:5px}
.pg-fill{height:5px;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#10b981);transition:width 0.3s}
.main{max-width:860px;margin:0 auto;padding:22px 16px}
.th-hero{background:linear-gradient(135deg,#1e3a5f,#064e3b);border-radius:12px;padding:28px;margin-bottom:24px;text-align:center}
.th-hero h2{font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:8px}
.th-hero p{color:#94a3b8;font-size:0.88rem;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;border:2px solid #2d3748;cursor:pointer;font-size:0.8rem;font-weight:600;color:#94a3b8;background:#1a1f2e;transition:all 0.15s;white-space:nowrap}
.tab.active{border-color:#3b82f6;color:#93c5fd;background:#1e3a5f}
.t-h3{font-size:0.93rem;font-weight:700;color:#e2e8f0;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid #2d3748}
.t-h3:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.card{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:13px}
.card h4{font-size:0.81rem;font-weight:700;margin-bottom:5px}
.card p{font-size:0.75rem;color:#94a3b8;line-height:1.5}
.card.c1 h4{color:#93c5fd}.card.c2 h4{color:#6ee7b7}.card.c3 h4{color:#c4b5fd}.card.c4 h4{color:#f59e0b}
.info-box{background:#1a1f2e;border-left:3px solid #3b82f6;border-radius:0 8px 8px 0;padding:11px 13px;margin-bottom:12px;font-size:0.83rem;line-height:1.6;color:#cbd5e1}
.info-box.green{border-color:#10b981}.info-box.yellow{border-color:#f59e0b}
.tw{overflow-x:auto;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th{background:#1e3a5f;color:#93c5fd;padding:7px 9px;text-align:left;font-weight:700}
td{padding:7px 9px;border-bottom:1px solid #2d3748;color:#cbd5e1;vertical-align:top}
tr:nth-child(even) td{background:#1a1f2e44}
.us-box{background:#0d1117;border:1px solid #2d3748;border-radius:8px;padding:13px;margin-bottom:10px;font-family:monospace;font-size:0.83rem;line-height:1.7}
.us-box .kw{color:#f59e0b}.us-box .val{color:#6ee7b7}
.start-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#10b981);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:22px;transition:opacity 0.2s}
.start-btn:hover{opacity:0.9}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:22px;height:22px;border-radius:50%;background:#2d3748;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:700;cursor:pointer;color:#64748b;border:2px solid transparent}
.dot.cur{border-color:#3b82f6;color:#93c5fd}
.dot.ok{background:#064e3b;color:#6ee7b7}
.dot.fail{background:#450a0a;color:#fca5a5}
.sec-lbl{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.sl1{background:#1e3a5f;color:#93c5fd}.sl2{background:#064e3b;color:#6ee7b7}
.qtype{display:inline-block;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:6px;background:#2d3748;color:#94a3b8;text-transform:uppercase}
.qcard{background:#1a1f2e;border:1px solid #2d3748;border-radius:10px;padding:20px;margin-bottom:14px}
.qnum{font-size:0.7rem;color:#64748b;font-weight:600;margin-bottom:4px}
.qtext{font-size:0.93rem;line-height:1.6;color:#e2e8f0;margin-bottom:13px}
.ctx-box{background:#0d1117;border:1px solid #2d3748;border-left:3px solid #f59e0b;border-radius:0 7px 7px 0;padding:11px 13px;margin-bottom:13px;font-size:0.82rem;color:#94a3b8;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{background:#0d1117;border:2px solid #2d3748;border-radius:7px;padding:10px 12px;cursor:pointer;font-size:0.85rem;color:#cbd5e1;transition:all 0.15s;display:flex;gap:8px;align-items:flex-start}
.opt:hover:not(.dis){border-color:#3b82f6;color:#fff}
.opt.sel{border-color:#3b82f6;background:#1e3a5f;color:#fff}
.opt.correct{border-color:#10b981;background:#064e3b;color:#6ee7b7}
.opt.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.opt.dis{cursor:default}
.okey{font-weight:700;color:#3b82f6;min-width:17px;flex-shrink:0}
.opt.correct .okey,.opt.wrong .okey{color:inherit}
.fb{margin-top:12px;padding:12px 14px;border-radius:7px;font-size:0.82rem;line-height:1.55;display:none}
.fb.show{display:block}
.fb.ok{background:#064e3b;border:1px solid #10b981;color:#6ee7b7}
.fb.fail{background:#450a0a;border:1px solid #ef4444;color:#fca5a5}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:7px;border:none;cursor:pointer;font-size:0.86rem;font-weight:600;transition:all 0.15s}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-p:disabled{background:#1e3a5f;color:#64748b;cursor:default}
.btn-g{background:transparent;color:#94a3b8;border:1px solid #2d3748}.btn-g:hover{border-color:#64748b;color:#e2e8f0}
.score-wrap{text-align:center;padding:44px 16px}
.score-big{font-size:4rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.score-sub{font-size:0.9rem;color:#94a3b8;margin:5px 0 24px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto 24px}
.sbox{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:13px}
.sbox h3{font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.sbox .n{font-size:1.5rem;font-weight:800}
.sbox.s1 h3,.sbox.s1 .n{color:#93c5fd}
.sbox.s2 h3,.sbox.s2 .n{color:#6ee7b7}
.sbox.s3 h3,.sbox.s3 .n{color:#f59e0b}
.fb-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2d3748;font-size:0.82rem}
.fb-item:last-child{border:none}
.fsec{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:14px;max-width:480px;margin:0 auto 24px;text-align:left}
.fsec h3{font-size:0.75rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:8px}

.build-progress{font-size:0.8rem;color:#94a3b8;margin:8px 0}
.build-canvas{background:#0d1117;border:1px solid #2d3748;border-radius:8px;padding:14px;min-height:60px;margin:10px 0;display:flex;flex-direction:column;gap:0}
.build-canvas-empty{color:#4b5563;font-size:0.82rem;text-align:center;padding:10px}
.build-placed{display:flex;align-items:center;gap:8px}
.build-placed-badge{background:#0d3b2e;border:1px solid #10b981;color:#6ee7b7;border-radius:8px;padding:11px 16px;font-size:0.74rem;flex:1}
.build-arrow-down{color:#4b5563;font-size:0.9rem;text-align:center;padding:2px 0 2px 20px}
.build-pool{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.build-el{background:#1e293b;border:1px solid #3b82f6;color:#cbd5e1;border-radius:8px;padding:14px 20px;font-size:0.72rem;cursor:pointer;transition:all .12s;user-select:none;min-width:110px;text-align:center;line-height:1.35}
.build-el:hover{background:#264663;border-color:#60a5fa}
.build-el.used{opacity:0.25;pointer-events:none;text-decoration:line-through}
.build-el.wrong{background:#450a0a;border-color:#ef4444;color:#fca5a5;animation:buildShake .4s}
@keyframes buildShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.build-done-banner{text-align:center;padding:16px;margin:10px 0;border-radius:10px}

+'<tr><td><b style="color:#8b5cf6">LeSS</b></td><td>Фреймворк масштабирования</td><td>Large-Scale Scrum. Минимум бюрократии, один Product Backlog для всех команд</td><td>Альтернатива SAFe, когда не нужна тяжёлая структура</td></tr>'
+'<tr><td><b style="color:#6ee7b7">XP (Extreme Programming)</b></td><td>Фреймворк (Agile)</td><td>Фокус на техническом совершенстве: TDD, парное программирование, CI, рефакторинг, короткие итерации 1-2 нед.</td><td>Высокие требования к качеству кода, технически сложные проекты</td></tr>'
+'<tr><td><b style="color:#6ee7b7">Lean Software Development</b></td><td>Философия</td><td>Адаптация Toyota Production System: устранение потерь (muda), поток ценности, встроенное качество, уважение к людям</td><td>Основа Kanban и многих Agile-практик, оптимизация существующих процессов</td></tr>'
+'<tr><td><b style="color:#94a3b8">Scrumban</b></td><td>Гибрид</td><td>Спринты из Scrum + WIP-лимиты и визуализация из Kanban. Более гибкое добавление задач в спринт</td><td>Команды поддержки продукта: есть запланированные задачи + срочные</td></tr>'
+'<tr><td><b style="color:#94a3b8">DevOps</b></td><td>Культура + практики</td><td>Dev + Ops = непрерывная интеграция и поставка (CI/CD). Автоматизация, мониторинг, быстрые релизы. Совместимо с любой методологией</td><td>Зрелые продуктовые команды, частые релизы, облачные продукты</td></tr>'
+'<tr><td><b style="color:#94a3b8">Shape Up</b></td><td>Метод (Basecamp)</td><td>Фиксированный appetit (6 недель), команды сами решают как. Без спринтов, без бэклога в классическом смысле</td><td>Небольшие продуктовые команды, альтернатива Scrum</td></tr>'
+'<tr><td><b style="color:#94a3b8">PRINCE2</b></td><td>Фреймворк</td><td>Процессный подход с жёсткими этапами и документацией. Популярен в Великобритании и госсекторе</td><td>Проекты с требованием строгой отчётности, UK/EU госсектор</td></tr>'
+'</table></div>'
+'<div class="t-h3">Ключевые отличия: Waterfall vs Инкрементная vs Итеративная vs Agile</div>'
+'<div class="tw"><table>'
+'<tr><th>Критерий</th><th>Waterfall</th><th>Инкрементная</th><th>Итеративная</th><th>Agile (Scrum)</th></tr>'
+'<tr><td><b>Требования</b></td><td>Фиксируются ДО начала</td><td>Фиксируются ДО, поставка частями</td><td>Уточняются на каждой итерации</td><td>Гибкие, меняются в любой момент</td></tr>'
+'<tr><td><b>Поставка</b></td><td>Один релиз в конце</td><td>Несколько, по инкрементам</td><td>Несколько, каждый лучше предыдущего</td><td>Каждый спринт (1-4 нед.)</td></tr>'
+'<tr><td><b>Изменения</b></td><td>Очень дороги</td><td>Сложны (требования зафиксированы)</td><td>Возможны между итерациями</td><td>Приветствуются</td></tr>'
+'<tr><td><b>Заказчик</b></td><td>Только в начале и конце</td><td>При сдаче каждого инкремента</td><td>После каждой итерации</td><td>Постоянно</td></tr>'
+'<tr><td><b>Риск обнаружения ошибок</b></td><td>Поздно (в конце)</td><td>Раньше (но частично)</td><td>Раньше</td><td>Быстро (каждый спринт)</td></tr>'
+'</table></div>'
+'<div class="t-h3">Гибридные модели (тренд 2026)</div>'
+'<div class="cards">'
+'<div class="card c4"><h4>Water-Scrum-Fall<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Гибридная модель: требования по Waterfall + разработка спринтами</span></h4><p>Стратегия и требования по Waterfall → разработка спринтами → внедрение по Waterfall. Популярен в корпорациях с фиксированными контрактами.</p></div>'
+'<div class="card c4"><h4>Scrumban<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Гибрид Скрама и Канбана</span></h4><p>Спринты + WIP-лимиты Kanban. Команды поддержки: плановые задачи + срочные без срыва спринта.</p></div>'
+'<div class="card c4"><h4>Scrum + XP<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Скрам + экстремальное программирование</span></h4><p>Scrum управляет процессом, XP обеспечивает качество (TDD, парное программирование). Самый популярный технический гибрид.</p></div>'
+'<div class="card c4"><h4>Scrum + DevOps<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Скрам + непрерывная интеграция и доставка</span></h4><p>Разработка спринтами + CI/CD-конвейер. Позволяет деплоить не раз в спринт, а при каждом коммите.</p></div>'
+'</div>',

lifecycle:'<div class="t-h3">SDLC — Жизненный цикл разработки ПО</div>'
+'<div class="info-box">SDLC (Software Development Life Cycle) — стандартный набор этапов, через которые проходит любой IT-проект. <b>Методология определяет, как эти этапы выполняются</b> (последовательно в Waterfall, итеративно в Agile).</div>'
+'<div class="tw"><table>'
+'<tr><th>#</th><th>Этап SDLC</th><th>Что происходит</th><th>Роль BA</th></tr>'
+'<tr><td>1</td><td><b style="color:#f59e0b">Планирование</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Planning</span></td><td>Оценка целесообразности, ресурсы, сроки, бюджет, выбор методологии</td><td>Помогает с оценкой scope и рисков</td></tr>'
+'<tr><td>2</td><td><b style="color:#f59e0b">Анализ требований</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Requirements Analysis</span></td><td>Сбор, уточнение, документирование требований</td><td><b>Главный этап для BA</b>: интервью, воркшопы, SRS/BRD</td></tr>'
+'<tr><td>3</td><td><b style="color:#3b82f6">Проектирование</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Design</span></td><td>Архитектура системы, дизайн БД, UI/UX, интерфейсы</td><td>Участвует в валидации решения, пишет UI-спецификации</td></tr>'
+'<tr><td>4</td><td><b style="color:#10b981">Разработка</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Development</span></td><td>Написание кода, unit-тесты</td><td>Отвечает на вопросы разработчиков по требованиям</td></tr>'
+'<tr><td>5</td><td><b style="color:#8b5cf6">Тестирование</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Testing</span></td><td>QA: функциональное, нагрузочное, UAT</td><td>Помогает составить тест-кейсы, участвует в UAT</td></tr>'
+'<tr><td>6</td><td><b style="color:#c4b5fd">Внедрение</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Deployment</span></td><td>Деплой, обучение пользователей, миграция данных</td><td>Документирует переходные требования, обучает</td></tr>'
+'<tr><td>7</td><td><b style="color:#94a3b8">Сопровождение</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Maintenance</span></td><td>Исправление ошибок, доработки, мониторинг</td><td>Анализирует запросы на изменение (CR)</td></tr>'
+'</table></div>'
+'<div class="t-h3">SDLC в Agile — итеративный цикл</div>'
+'<div class="info-box green">В Agile SDLC не линейный, а <b>итеративный</b>: каждый спринт проходит мини-цикл Анализ → Проектирование → Разработка → Тестирование → Релиз. BA работает на 1-2 спринта вперёд (refinement), пока команда разрабатывает текущие задачи.</div>'
+'<div class="t-h3">Жизненный цикл продукта (Product Lifecycle)</div>'
+'<div class="tw"><table>'
+'<tr><th>Фаза</th><th>Описание</th><th>Задачи BA</th></tr>'
+'<tr><td><b style="color:#f59e0b">🌱 Введение (Introduction)</b></td><td>Выход на рынок, первые пользователи, MVP</td><td>Discovery, формирование бэклога, метрики запуска</td></tr>'
+'<tr><td><b style="color:#10b981">📈 Рост (Growth)</b></td><td>Рост аудитории, доработка функций, масштабирование</td><td>Анализ данных о пользователях, новые фичи, оптимизация</td></tr>'
+'<tr><td><b style="color:#3b82f6">🏔️ Зрелость (Maturity)</b></td><td>Пик пользователей, конкурентный рынок</td><td>Удержание, оптимизация затрат, дифференциация</td></tr>'
+'<tr><td><b style="color:#94a3b8">📉 Упадок (Decline)</b></td><td>Снижение интереса, замена новым продуктом</td><td>Стратегия выхода, миграция пользователей</td></tr>'
+'</table></div>'
+'<div class="t-h3">Жизненный цикл требования</div>'
+'<div class="info-box">Каждое требование проходит свой путь: <b>Выявление → Анализ → Документирование → Верификация → Согласование → Реализация → Тестирование → Сопровождение (изменение/удаление)</b>. В Agile этот цикл итеративен и короче.</div>'
+'<div class="tw"><table><tr><th>Статус</th><th>Что значит</th></tr>'
+'<tr><td>📝 Черновик (Draft)</td><td>Зафиксировано, ещё уточняется</td></tr>'
+'<tr><td>✅ Согласовано (Approved)</td><td>Подтверждено стейкхолдерами, готово к реализации</td></tr>'
+'<tr><td>🔨 В разработке (In Development)</td><td>Команда реализует</td></tr>'
+'<tr><td>🧪 На тестировании (In Testing)</td><td>QA проверяет</td></tr>'
+'<tr><td>✔️ Выполнено (Done)</td><td>Соответствует DoD</td></tr>'
+'<tr><td>🗑️ Отклонено / Удалено (Rejected)</td><td>Не будет реализовано в этой версии</td></tr>'
+'</table></div>',

sql:'<div class="t-h3">Зачем BA знать SQL?</div>'
+'<div class="info-box">BA использует SQL для: <b>самостоятельного анализа данных</b>, формулирования требований к отчётам, проверки данных в БД, общения с разработчиками на одном языке. Базовый уровень — обязателен на большинстве собеседований SA/BA уровня Middle+.</div>'
+'<div class="t-h3">Базовые команды SELECT</div>'
+'<div class="us-box">'
+'<span class="kw">-- Выбрать все колонки из таблицы</span><br>'
+'<span class="kw">SELECT</span> <span class="val">*</span> <span class="kw">FROM</span> <span class="val">orders</span>;<br><br>'
+'<span class="kw">-- Выбрать конкретные колонки</span><br>'
+'<span class="kw">SELECT</span> <span class="val">id, customer_name, total_amount</span> <span class="kw">FROM</span> <span class="val">orders</span>;<br><br>'
+'<span class="kw">-- С условием</span><br>'
+'<span class="kw">SELECT</span> <span class="val">*</span> <span class="kw">FROM</span> <span class="val">orders</span> <span class="kw">WHERE</span> <span class="val">status = \'completed\'</span>;<br><br>'
+'<span class="kw">-- Несколько условий</span><br>'
+'<span class="kw">SELECT</span> <span class="val">*</span> <span class="kw">FROM</span> <span class="val">orders</span> <span class="kw">WHERE</span> <span class="val">status = \'completed\'</span> <span class="kw">AND</span> <span class="val">total_amount > 5000</span>;<br><br>'
+'<span class="kw">-- Сортировка</span><br>'
+'<span class="kw">SELECT</span> <span class="val">*</span> <span class="kw">FROM</span> <span class="val">orders</span> <span class="kw">ORDER BY</span> <span class="val">created_at</span> <span class="kw">DESC</span>;<br><br>'
+'<span class="kw">-- Ограничение числа строк</span><br>'
+'<span class="kw">SELECT</span> <span class="val">*</span> <span class="kw">FROM</span> <span class="val">orders</span> <span class="kw">LIMIT</span> <span class="val">10</span>;'
+'</div>'
+'<div class="t-h3">WHERE — операторы фильтрации</div>'
+'<div class="tw"><table><tr><th>Оператор</th><th>Пример</th><th>Смысл</th></tr>'
+'<tr><td>=, !=, &lt;, &gt;, &lt;=, &gt;=</td><td>amount &gt; 1000</td><td>Сравнение значений</td></tr>'
+'<tr><td>AND, OR, NOT</td><td>status = \'new\' AND amount &gt; 500</td><td>Логические операторы</td></tr>'
+'<tr><td>IN (...)</td><td>status IN (\'new\', \'pending\')</td><td>Значение из списка</td></tr>'
+'<tr><td>BETWEEN ... AND ...</td><td>amount BETWEEN 100 AND 500</td><td>Диапазон значений</td></tr>'
+'<tr><td>LIKE \'%...%\'</td><td>name LIKE \'%Иван%\'</td><td>Поиск по шаблону (% = любые символы)</td></tr>'
+'<tr><td>IS NULL / IS NOT NULL</td><td>email IS NOT NULL</td><td>Проверка на NULL</td></tr>'
+'</table></div>'
+'<div class="t-h3">JOIN — объединение таблиц</div>'
+'<div class="us-box">'
+'<span class="kw">-- INNER JOIN: только совпадающие строки в обеих таблицах</span><br>'
+'<span class="kw">SELECT</span> <span class="val">o.id, o.total_amount, c.name</span><br>'
+'<span class="kw">FROM</span> <span class="val">orders o</span><br>'
+'<span class="kw">INNER JOIN</span> <span class="val">customers c</span> <span class="kw">ON</span> <span class="val">o.customer_id = c.id</span>;<br><br>'
+'<span class="kw">-- LEFT JOIN: все строки из левой таблицы + совпадения из правой</span><br>'
+'<span class="kw">SELECT</span> <span class="val">c.name, o.total_amount</span><br>'
+'<span class="kw">FROM</span> <span class="val">customers c</span><br>'
+'<span class="kw">LEFT JOIN</span> <span class="val">orders o</span> <span class="kw">ON</span> <span class="val">c.id = o.customer_id</span>;<br>'
+'<span class="kw">-- ↑ Покажет всех клиентов, даже тех, у кого нет заказов (NULL в поле заказа)</span>'
+'</div>'
+'<div class="tw"><table><tr><th>Тип JOIN</th><th>Результат</th><th>Когда использовать</th></tr>'
+'<tr><td><b>INNER JOIN</b></td><td>Только строки, есть в ОБЕИХ таблицах</td><td>Нужны только связанные данные</td></tr>'
+'<tr><td><b>LEFT JOIN</b></td><td>Все из левой + совпадения из правой (NULL, если нет)</td><td>Все клиенты, даже без заказов</td></tr>'
+'<tr><td><b>RIGHT JOIN</b></td><td>Все из правой + совпадения из левой</td><td>Редко, лучше поменять таблицы местами</td></tr>'
+'<tr><td><b>FULL OUTER JOIN</b></td><td>Все строки из обеих таблиц</td><td>Анализ расхождений между двумя наборами</td></tr>'
+'</table></div>'
+'<div class="t-h3">GROUP BY, HAVING, агрегатные функции</div>'
+'<div class="us-box">'
+'<span class="kw">-- Агрегатные функции</span><br>'
+'<span class="kw">SELECT</span><br>'
+'&nbsp;&nbsp;<span class="val">COUNT(*)</span> <span class="kw">AS</span> <span class="val">total_orders</span>,&nbsp;&nbsp;&nbsp;<span class="kw">-- количество строк</span><br>'
+'&nbsp;&nbsp;<span class="val">SUM(total_amount)</span> <span class="kw">AS</span> <span class="val">revenue</span>,&nbsp;&nbsp;&nbsp;<span class="kw">-- сумма</span><br>'
+'&nbsp;&nbsp;<span class="val">AVG(total_amount)</span> <span class="kw">AS</span> <span class="val">avg_order</span>,&nbsp;&nbsp;&nbsp;<span class="kw">-- среднее</span><br>'
+'&nbsp;&nbsp;<span class="val">MAX(total_amount)</span> <span class="kw">AS</span> <span class="val">max_order</span>,&nbsp;&nbsp;&nbsp;<span class="kw">-- максимум</span><br>'
+'&nbsp;&nbsp;<span class="val">MIN(total_amount)</span> <span class="kw">AS</span> <span class="val">min_order</span>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">-- минимум</span><br>'
+'<span class="kw">FROM</span> <span class="val">orders</span>;<br><br>'
+'<span class="kw">-- GROUP BY: подсчёт по группам</span><br>'
+'<span class="kw">SELECT</span> <span class="val">status, COUNT(*) AS cnt, SUM(total_amount) AS total</span><br>'
+'<span class="kw">FROM</span> <span class="val">orders</span><br>'
+'<span class="kw">GROUP BY</span> <span class="val">status</span><br>'
+'<span class="kw">ORDER BY</span> <span class="val">total DESC</span>;<br><br>'
+'<span class="kw">-- HAVING: фильтр ПОСЛЕ группировки (WHERE — ДО)</span><br>'
+'<span class="kw">SELECT</span> <span class="val">customer_id, COUNT(*) AS order_count</span><br>'
+'<span class="kw">FROM</span> <span class="val">orders</span><br>'
+'<span class="kw">GROUP BY</span> <span class="val">customer_id</span><br>'
+'<span class="kw">HAVING</span> <span class="val">COUNT(*) > 5</span>;&nbsp;&nbsp;<span class="kw">-- только клиенты с более чем 5 заказами</span>'
+'</div>'
+'<div class="info-box yellow"><b>Правило порядка:</b> WHERE → GROUP BY → HAVING → ORDER BY → LIMIT. WHERE фильтрует строки ДО группировки, HAVING — ПОСЛЕ. Нельзя писать WHERE COUNT(*) > 5 — только HAVING.</div>'
+'<div class="t-h3">Порядок выполнения SQL-запроса</div>'
+'<div class="tw"><table><tr><th>Шаг</th><th>Клауза</th><th>Что делает</th></tr>'
+'<tr><td>1</td><td>FROM / JOIN</td><td>Определяет источник данных, объединяет таблицы</td></tr>'
+'<tr><td>2</td><td>WHERE</td><td>Фильтрует строки ДО агрегации</td></tr>'
+'<tr><td>3</td><td>GROUP BY</td><td>Группирует строки по значению</td></tr>'
+'<tr><td>4</td><td>HAVING</td><td>Фильтрует группы ПОСЛЕ агрегации</td></tr>'
+'<tr><td>5</td><td>SELECT</td><td>Выбирает нужные колонки / выражения</td></tr>'
+'<tr><td>6</td><td>ORDER BY</td><td>Сортирует результат</td></tr>'
+'<tr><td>7</td><td>LIMIT / OFFSET</td><td>Ограничивает количество строк</td></tr>'
+'</table></div>'
+'<div class="t-h3">INSERT — добавление данных</div>'
+'<div class="us-box">'
+'<span class="kw">-- Вставить одну строку</span><br>'
+'<span class="kw">INSERT INTO</span> <span class="val">customers (name, email, city)</span><br>'
+'<span class="kw">VALUES</span> <span class="val">(\'Иван Петров\', \'ivan@mail.ru\', \'Москва\')</span>;<br><br>'
+'<span class="kw">-- Вставить несколько строк сразу</span><br>'
+'<span class="kw">INSERT INTO</span> <span class="val">orders (customer_id, status, total_amount)</span><br>'
+'<span class="kw">VALUES</span><br>'
+'&nbsp;&nbsp;<span class="val">(1, \'new\', 1500.00)</span>,<br>'
+'&nbsp;&nbsp;<span class="val">(1, \'new\', 3200.50)</span>,<br>'
+'&nbsp;&nbsp;<span class="val">(2, \'new\', 750.00)</span>;<br><br>'
+'<span class="kw">-- Вставить данные из другой таблицы (INSERT SELECT)</span><br>'
+'<span class="kw">INSERT INTO</span> <span class="val">orders_archive (id, customer_id, total_amount)</span><br>'
+'<span class="kw">SELECT</span> <span class="val">id, customer_id, total_amount</span><br>'
+'<span class="kw">FROM</span> <span class="val">orders</span><br>'
+'<span class="kw">WHERE</span> <span class="val">status = \'completed\' AND created_at < \'2024-01-01\'</span>;'
+'</div>'
+'<div class="t-h3">UPDATE — изменение данных</div>'
+'<div class="info-box yellow">⚠️ <b>Всегда используй WHERE в UPDATE!</b> Без WHERE — обновятся ВСЕ строки таблицы. Правило: сначала напиши SELECT с тем же WHERE, убедись что видишь нужные строки, потом меняй на UPDATE.</div>'
+'<div class="us-box">'
+'<span class="kw">-- Обновить одно поле</span><br>'
+'<span class="kw">UPDATE</span> <span class="val">customers</span><br>'
+'<span class="kw">SET</span> <span class="val">city = \'Санкт-Петербург\'</span><br>'
+'<span class="kw">WHERE</span> <span class="val">id = 42</span>;<br><br>'
+'<span class="kw">-- Обновить несколько полей</span><br>'
+'<span class="kw">UPDATE</span> <span class="val">orders</span><br>'
+'<span class="kw">SET</span> <span class="val">status = \'cancelled\', updated_at = NOW()</span><br>'
+'<span class="kw">WHERE</span> <span class="val">customer_id = 7 AND status = \'new\'</span>;<br><br>'
+'<span class="kw">-- Обновить на основе другой таблицы (UPDATE JOIN)</span><br>'
+'<span class="kw">UPDATE</span> <span class="val">orders o</span><br>'
+'<span class="kw">JOIN</span> <span class="val">customers c ON o.customer_id = c.id</span><br>'
+'<span class="kw">SET</span> <span class="val">o.status = \'vip_processing\'</span><br>'
+'<span class="kw">WHERE</span> <span class="val">c.tier = \'vip\' AND o.status = \'new\'</span>;<br><br>'
+'<span class="kw">-- Опасно! БЕЗ WHERE — обновятся ВСЕ строки:</span><br>'
+'<span class="kw">UPDATE</span> <span class="val">orders</span> <span class="kw">SET</span> <span class="val">status = \'cancelled\'</span>; <span class="kw">-- ❌ НЕ ДЕЛАЙ ТАК</span>'
+'</div>'
+'<div class="t-h3">DELETE — удаление данных</div>'
+'<div class="info-box" style="border-color:#ef4444"><b>⚠️ DELETE необратим без транзакции!</b> Всегда: 1) сделай SELECT с тем же WHERE и проверь строки, 2) используй транзакцию (BEGIN/ROLLBACK), 3) только потом COMMIT. Или сначала переноси в архив через INSERT SELECT.</div>'
+'<div class="us-box">'
+'<span class="kw">-- Удалить конкретную строку</span><br>'
+'<span class="kw">DELETE FROM</span> <span class="val">orders</span><br>'
+'<span class="kw">WHERE</span> <span class="val">id = 105</span>;<br><br>'
+'<span class="kw">-- Удалить по условию</span><br>'
+'<span class="kw">DELETE FROM</span> <span class="val">orders</span><br>'
+'<span class="kw">WHERE</span> <span class="val">status = \'cancelled\' AND created_at < NOW() - INTERVAL \'90 days\'</span>;<br><br>'
+'<span class="kw">-- Безопасный паттерн: проверить перед удалением</span><br>'
+'<span class="kw">BEGIN</span>;<br>'
+'<span class="kw">DELETE FROM</span> <span class="val">orders</span> <span class="kw">WHERE</span> <span class="val">customer_id = 42</span>;<br>'
+'<span class="kw">-- Проверяем результат...</span><br>'
+'<span class="kw">ROLLBACK</span>; <span class="kw">-- или COMMIT если всё верно</span>'
+'</div>'
+'<div class="t-h3">Сравнение DELETE, TRUNCATE, DROP</div>'
+'<div class="tw"><table><tr><th>Команда</th><th>Что делает</th><th>WHERE</th><th>Откат</th><th>Когда использовать</th></tr>'
+'<tr><td><b style="color:#ef4444">DELETE</b></td><td>Удаляет строки по условию</td><td>✅ Да</td><td>✅ Можно (в транзакции)</td><td>Удалить конкретные записи</td></tr>'
+'<tr><td><b style="color:#f59e0b">TRUNCATE</b></td><td>Очищает всю таблицу целиком</td><td>❌ Нет</td><td>⚠️ Зависит от СУБД</td><td>Очистить таблицу, сбросить auto-increment</td></tr>'
+'<tr><td><b style="color:#ef4444">DROP TABLE</b></td><td>Удаляет таблицу со всей структурой</td><td>❌ Нет</td><td>❌ Необратимо</td><td>Удалить таблицу полностью</td></tr>'
+'</table></div>'
+'<div class="t-h3">Транзакции — атомарность операций</div>'
+'<div class="info-box green"><b>Транзакция</b> — группа операций, которые выполняются как одно целое: либо все, либо ни одна. Свойства ACID: Atomicity, Consistency, Isolation, Durability.</div>'
+'<div class="us-box">'
+'<span class="kw">BEGIN</span>;  <span class="kw">-- начало транзакции</span><br><br>'
+'<span class="kw">UPDATE</span> <span class="val">accounts</span> <span class="kw">SET</span> <span class="val">balance = balance - 1000</span> <span class="kw">WHERE</span> <span class="val">id = 1</span>;<br>'
+'<span class="kw">UPDATE</span> <span class="val">accounts</span> <span class="kw">SET</span> <span class="val">balance = balance + 1000</span> <span class="kw">WHERE</span> <span class="val">id = 2</span>;<br><br>'
+'<span class="kw">COMMIT</span>;   <span class="kw">-- подтвердить (оба UPDATE применяются)</span><br>'
+'<span class="kw">-- или --</span><br>'
+'<span class="kw">ROLLBACK</span>; <span class="kw">-- отменить всё (оба UPDATE откатываются)</span>'
+'</div>',

elicit:'<div class="t-h3">9 техник выявления требований (BABOK v3)</div>'
+'<div class="cards">'
+'<div class="card c1"><h4>🎤 Интервью<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Interview</span></h4><p>Структурированные (список вопросов) или свободные (уточняющие вопросы). Для глубокого понимания проблемы конкретного человека.</p></div>'

+'<div class="card c1"><h4>👁 Наблюдение<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Observation</span></h4><p>Аналитик смотрит за работой пользователя. Выявляет неявное знание — то, что люди делают автоматически и не могут описать.</p></div>'
+'<div class="card c2"><h4>📄 Анализ документов<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Document Analysis</span></h4><p>Изучение регламентов, инструкций, отчётов. Выполняется ДО встреч — чтобы прийти подготовленным.</p></div>'
+'<div class="card c1"><h4>📋 Анкетирование<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Survey / Questionnaire</span></h4><p>Письменный сбор. Хорош при большой аудитории или закрытой корпоративной культуре.</p></div>'
+'<div class="card c2"><h4>🎨 Прототипирование<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Prototyping</span></h4><p>Макеты для уточнения требований. Помогает стейкхолдерам «увидеть» систему и сформулировать требования.</p></div>'
+'<div class="card c1"><h4>💡 Мозговой штурм<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Brainstorming</span></h4><p>Генерация идей без критики. Потом — оценка и фильтрация. Открытые команды.</p></div>'
+'<div class="card c2"><h4>👥 Фокус-группа<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Focus Group</span></h4><p>Отобранные стейкхолдеры обсуждают идеи после мозгового штурма.</p></div>'
+'<div class="card c1"><h4>🔌 Анализ интерфейсов<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Interface Analysis</span></h4><p>Как системы взаимодействуют друг с другом. Интеграционные требования.</p></div>'
+'</div>'
+'<div class="t-h3">Когда использовать какую технику?</div>'
+'<div class="tw"><table><tr><th>Ситуация</th><th>Техника</th></tr>'

+'<div class="t-h3">Открытые vs закрытые вопросы в интервью</div>'

artifacts:'<div class="t-h3">⚡ Быстрое определение (запомнить в 5 секунд) / Quick Definitions</div>'
+'<div class="tw"><table>'
+'<tr><th></th><th>Определение</th></tr>'
+'<tr><td><b style="color:#6ee7b7">User Story</b></td><td>Краткое (1-3 предложения) описание потребности с точки зрения пользователя, обязательно включающее <b>ЦЕННОСТЬ</b>: «Как [роль], я хочу [действие], <b>чтобы [ценность/выгода]</b>». Без части «чтобы» — это просто требование, а не полноценная User Story.</td></tr>'
+'<tr><td><b style="color:#93c5fd">Use Case</b></td><td>Детальный пошаговый документ, описывающий взаимодействие <b>актора</b> (пользователя ИЛИ другой системы) с системой для достижения цели — включает Основной сценарий (Main Flow), <b>Альтернативные потоки</b> (Alternative Flow), <b>Исключения</b> (Exception Flow) и Пред-/Постусловия.</td></tr>'
+'</table></div>'
+'<div class="info-box yellow"><b>Частая недосказанность в этих определениях:</b> «одно предложение» и «пользователь взаимодействует с системой» — верно НАПРАВЛЕНИЕ, но интервьюер обычно проверяет именно детали: для User Story — есть ли явная ЦЕННОСТЬ (не просто «фича»), для Use Case — упомянуты ли Alternative/Exception Flow и то, что актором может быть не только человек, но и другая система (например, cron-job или внешний сервис). Полная структура и разбор ошибок — ниже.</div>'

+'<div class="t-h3">User Story — структура и полный пример</div>'
+'<div class="info-box">Формат: <b>Как [роль], я хочу [действие], чтобы [ценность/цель]</b>. Три части обязательны. Дополнительно: критерии приёмки, приоритет, оценка.</div>'
+'<div class="us-box">'
+'<span class="kw">Как</span> <span class="val">зарегистрированный покупатель интернет-магазина</span>,<br>'
+'<span class="kw">Я хочу</span> <span class="val">добавить товар в список желаний</span>,<br>'
+'<span class="kw">Чтобы</span> <span class="val">вернуться к нему позже и купить, когда будут деньги</span>.<br><br>'
+'<span class="kw">Критерии приёмки:</span><br>'

+'<span class="val">4. Товар можно удалить из списка желаний одним кликом</span>'
+'</div>'
+'<div class="t-h3">Признаки хорошей User Story — критерии INVEST</div>'
+'<div class="tw"><table>'
+'<tr><th>Буква</th><th>Критерий</th><th>Что значит</th><th>Плохо / Хорошо</th></tr>'
+'<tr><td><b style="color:#6ee7b7">I</b></td><td>Independent (Независимая)</td><td>Не зависит от других историй</td><td>❌ «После US-12» / ✅ Самостоятельная</td></tr>'
+'<tr><td><b style="color:#6ee7b7">N</b></td><td>Negotiable (Договорная)</td><td>Детали можно обсуждать</td><td>❌ Жёстко прописана реализация / ✅ Гибкость в деталях</td></tr>'
+'<tr><td><b style="color:#6ee7b7">V</b></td><td>Valuable (Ценная)</td><td>Приносит ценность пользователю</td><td>❌ «Создать таблицу в БД» / ✅ «Сохранить список желаний»</td></tr>'
+'<tr><td><b style="color:#6ee7b7">E</b></td><td>Estimable (Оцениваемая)</td><td>Команда может оценить в SP</td><td>❌ Слишком размыто / ✅ Понятный объём</td></tr>'
+'<tr><td><b style="color:#6ee7b7">S</b></td><td>Small (Маленькая)</td><td>Делается за 1 спринт</td><td>❌ «Полный профиль пользователя» / ✅ «Изменить имя в профиле»</td></tr>'
+'<tr><td><b style="color:#6ee7b7">T</b></td><td>Testable (Тестируемая)</td><td>Есть чёткие критерии приёмки</td><td>❌ «Должно быть удобно» / ✅ Given/When/Then AC</td></tr>'
+'</table></div>'
+'<div class="t-h3">Use Case — структура и полный пример</div>'
+'<div class="info-box">Use Case описывает взаимодействие между актором и системой для достижения цели. Используется в Waterfall или когда нужна полная спецификация сценария.</div>'
+'<div class="us-box">'

+'<span class="kw">Исключение E2:</span> <span class="val">Ссылка просрочена (TTL истёк) → Страница ошибки «Ссылка устарела» с кнопкой «Запросить новую ссылку»</span>'
+'</div>'
+'<div class="info-box" style="border-color:#ef4444"><b>⚠️ Частая ошибка в примере выше:</b> Альтернативный сценарий A на самом деле ОШИБКА (Exception Flow), а не альтернатива (Alternative Flow) — путаница встречается даже в готовых шаблонах, сгенерированных AI-инструментами. Разбор ниже.</div>'

+'<div class="t-h3">⚠️ Main vs Alternative vs Exception Flow — как не путать</div>'
+'<div class="info-box yellow">Это одна из самых частых ошибок на практике — даже в готовых ответах ChatGPT эти типы потоков путают. Главный критерий разграничения: <b>Alternative Flow — это ВЫБОР пользователя, ведущий к УСПЕХУ другим путём. Exception Flow — это ОШИБКА или ПРЕРЫВАНИЕ, ведущее к НЕУДАЧЕ или повтору.</b></div>'
+'<div class="tw"><table>'
+'<tr><th>Критерий</th><th style="color:#10b981">Alternative Flow</th><th style="color:#ef4444">Exception Flow</th></tr>'
+'<tr><td><b>Инициатор</b></td><td>Пользователь ВЫБИРАЕТ этот путь сам</td><td>Происходит ОШИБКА или сбой условия</td></tr>'
+'<tr><td><b>Результат</b></td><td>Цель UseCase всё равно ДОСТИГНУТА</td><td>Цель UseCase НЕ достигнута в этой попытке</td></tr>'

+'<div class="t-h3">📋 Эталонный пример — UC: Вход пользователя в систему (исправленная версия)</div>'
+'<div class="info-box green">Это переработанный пример на основе реального разбора типичных ошибок: смешение нескольких UseCase в один, отсутствие точных условий блокировки, путаница Alternative/Exception.</div>'

+'<span class="kw">Исключение E1 (Exception Flow):</span> <span class="val">Неверные учётные данные → общее сообщение об ошибке «Неверный логин или пароль» (без уточнения, что именно неверно — защита от подбора)</span><br>'
+'<span class="kw">Исключение E2:</span> <span class="val">5 неверных попыток подряд за 15 минут → аккаунт блокируется на 30 минут, на email отправляется уведомление о блокировке с возможностью досрочной разблокировки по ссылке</span><br>'
+'<span class="kw">Исключение E3:</span> <span class="val">Учётная запись деактивирована администратором → вход прерывается, пользователь направляется на страницу «Обратитесь в поддержку»</span>'
+'</div>'
+'<div class="info-box"><b>Что исправлено по сравнению с типичной ошибкой:</b> 1) Указаны ТОЧНЫЕ числа блокировки (5 попыток / 15 минут / блокировка 30 минут) — без этого Exception Flow неполный. 2) MFA не включена в этот UC — если она обязательна для всех, это отдельный шаг основного потока ИЛИ отдельный UC «Подтверждение через MFA», связанный через «include». 3) Указаны оба постусловия — успешное И неуспешное. 4) Alternative Flow строго ограничен путями, ведущими к УСПЕХУ другим способом.</div>'

+'<div class="t-h3">🔀 Magic Link vs Password Reset Link — не путать!</div>'
+'<div class="info-box yellow">Часто путают два РАЗНЫХ механизма с похожим UI (письмо со ссылкой), но разной логикой безопасности — это разные UseCase.</div>'

+'<div class="card c4"><h4>📥 Определение готовности (DoR)</h4><p><b>Вход в спринт.</b> Типовой DoR: ✓ US написана по шаблону ✓ AC определены ✓ Оценена в SP ✓ Дизайн согласован ✓ Нет блокирующих зависимостей ✓ PO доступен для вопросов</p></div>'

+'<div class="card c1"><h4>✅ Критерии приёмки (AC)</h4><p><b>Для конкретной US.</b> Формат Дано/Когда/Тогда: Given — начальное условие, When — действие, Then — ожидаемый результат. Должны быть <b>проверяемыми</b>: QA пишет тест-кейс по AC без уточнений.</p></div>'

agile:'<div class="t-h3">Скрам — роли</div>'
+'<div class="cards">'
+'<div class="card c4"><h4>Владелец продукта <small style="color:#f59e0b80">(Product Owner)</small></h4><p>Отвечает за бэклог и приоритеты. Принимает решения о содержании продукта.</p></div>'
+'<div class="card c1"><h4>Скрам-мастер <small style="color:#93c5fd80">(Scrum Master)</small></h4><p>Фасилитирует процесс, убирает блокеры, защищает команду от внешних помех.</p></div>'
+'<div class="card c2"><h4>Команда разработки <small style="color:#6ee7b780">(Dev Team)</small></h4><p>Кросс-функциональная команда 3-9 человек. Сама выбирает, сколько взять в спринт.</p></div>'
+'<div class="card c3"><h4>BA в Скраме<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">BA in Scrum</span></h4><p>Помогает владельцу продукта: пишет пользовательские истории и критерии приёмки, ведёт уточнение бэклога, переводит бизнес ↔ команда.</p></div>'
+'</div>'
+'<div class="t-h3">Скрам-церемонии</div>'
+'<div class="tw"><table><tr><th>Церемония</th><th>Цель</th><th>Длит.</th></tr>'
+'<tr><td><b>Планирование спринта</b><br><small style="color:#64748b">Sprint Planning</small></td><td>Выбрать задачи, договориться о цели спринта</td><td>До 8ч/месяц</td></tr>'
+'<tr><td><b>Ежедневный Scrum</b><br><small style="color:#64748b">Daily Scrum</small></td><td>Синхронизация: сделано, планы, блокеры</td><td>15 мин</td></tr>'
+'<tr><td><b>Обзор спринта</b><br><small style="color:#64748b">Sprint Review</small></td><td>Демонстрация инкремента стейкхолдерам</td><td>До 4ч/месяц</td></tr>'
+'<tr><td><b>Ретроспектива</b><br><small style="color:#64748b">Retrospective</small></td><td>Улучшение процесса команды</td><td>До 3ч/месяц</td></tr>'
+'<tr><td><b>Уточнение бэклога</b><br><small style="color:#64748b">Backlog Refinement</small></td><td>Уточнение и оценка задач будущих спринтов</td><td>~10% спринта</td></tr>'
+'</table></div>'
+'<div class="t-h3">Канбан vs Скрам — ключевые отличия</div>'
+'<div class="tw"><table><tr><th></th><th>Скрам (Scrum)</th><th>Канбан (Kanban)</th></tr>'
+'<tr><td><b>Итерации</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Iterations</span></td><td>Фиксированные спринты (1-4 нед)</td><td>Непрерывный поток задач</td></tr>'
+'<tr><td><b>WIP-лимиты</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">WIP limits</span></td><td>Нет (спринт ограничивает объём)</td><td>Обязательны — контроль потока</td></tr>'

+'<tr><td><b>Применение</b><br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Application</span></td><td>Новая разработка</td><td>Поддержка, сервисные команды</td></tr>'
+'</table></div>'
+'<div class="t-h3">Оценка задач и приоритизация</div>'
+'<div class="cards">'
+'<div class="card c1"><h4>Очки истории (Story Points)<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Относительная оценка сложности задачи</span></h4><p>Относительная мера сложности (не время). Учитывает объём + сложность + неизвестность. Метод: Покер планирования (Planning Poker), шкала Фибоначчи.</p></div>'
+'<div class="card c4"><h4>MoSCoW<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Метод приоритизации требований</span></h4><p>Обязательно / Желательно / Возможно / Не сейчас. Быстро для MVP. «Обязательно» = то, без чего продукт не работает.</p></div>'
+'<div class="card c2"><h4>RICE<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Метод приоритизации: Охват×Влияние×Уверенность/Усилия</span></h4><p>Охват × Влияние × Уверенность / Усилия. Даёт числовой приоритет. Объективнее MoSCoW.</p></div>'
+'<div class="card c3"><h4>Модель Кано (Kano)<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Модель удовлетворённости пользователя</span></h4><p>Базовые / Улучшатели / Восхитители. Для понимания, что создаёт WOW-эффект, а что просто обязательно.</p></div>'
+'<div class="card c1" style="grid-column:1/-1"><h4>⚖️ WSJF (Weighted Shortest Job First)<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Взвешенная приоритизация самых коротких задач</span></h4><p>Метод SAFe: <b>Стоимость задержки ÷ Размер задачи</b>. Сначала — самая ценная и быстровыполнимая работа. Используется для приоритизации фич, эпиков, историй.</p></div>'
+'</div>'
+'<div class="t-h3">💸 Cost of Delay и WSJF — подробно</div>'
+'<div class="info-box">Cost of Delay — это <b>ценность, которую теряет бизнес за каждый период откладывания задачи</b>. Концепция Дональда Райнертсена (книга «Принципы потока разработки продукта»). Если интеграция с платёжным шлюзом приносит 1 млн руб./мес. — каждый месяц задержки стоит 1 млн.</div>'
+'<div class="t-h3">Шкала баллов в WSJF</div>'
+'<div class="info-box yellow"><b>Важно: в WSJF используют НЕ абсолютные числа, а ОТНОСИТЕЛЬНЫЕ оценки.</b> Шкала — модифицированная Фибоначчи SAFe: <b>1, 2, 3, 5, 8, 13, 20</b> (иногда добавляют 0.5 и бесконечность ∞).<br><br>'
+'Алгоритм оценки на сессии с командой:<br>'
+'1. Выбрать <b>baseline-задачу</b> (среднюю по сложности) — присвоить ей 8 по каждому параметру.<br>'
+'2. Оценить остальные задачи <b>относительно baseline</b>: эта задача вдвое важнее? → 13. Вдвое менее важна? → 5.<br>'
+'3. Тот же принцип для Job Size: эта задача вдвое меньше baseline? → 4 (или 5 по шкале).<br>'
+'Оценки — относительные, а не в деньгах или часах. Точность не нужна — важна последовательность приоритетов.</div>'
+'<div class="tw"><table>'
+'<tr><th colspan="2">Формула WSJF (SAFe)</th></tr>'
+'<tr><td style="font-size:1.1rem;text-align:center;padding:12px" colspan="2"><b style="color:#f59e0b">WSJF = CoD ÷ Job Size</b><br><span style="font-size:0.8rem;color:#94a3b8">CoD = Бизнес-ценность + Срочность по времени + Снижение риска / Создание возможностей</span></td></tr>'
+'<tr><th>Компонент CoD</th><th>Что означает + как оценивать</th></tr>'
+'<tr><td><b style="color:#6ee7b7">Бизнес-ценность</b><br><small>User-Business Value</small></td><td>Насколько громко просят пользователи? Какой доход принесёт? Что потеряем, если не сделаем? <b>Высокий доход + много запросов → 13. Малозаметная фича → 1-2.</b></td></tr>'
+'<tr><td><b style="color:#93c5fd">Срочность по времени</b><br><small>Time Criticality</small></td><td>Как быстро теряется ценность при задержке? Есть ли дедлайн, рыночное окно, регуляторный срок? <b>Жёсткий дедлайн через 2 нед. → 13. Нет срочности → 1.</b></td></tr>'
+'<tr><td><b style="color:#c4b5fd">Снижение риска / Возможности</b><br><small>Risk Reduction / Opportunity Enablement</small></td><td>Снижает ли риски? Открывает ли новые возможности? <b>Блокирует архитектурный риск → 8-13. Косметическое улучшение → 1.</b></td></tr>'
+'<tr><td><b style="color:#f87171">Размер задачи (Job Size)</b></td><td>Оценка объёма по шкале Фибоначчи SAFe (1, 2, 3, 5, 8, 13, 20). <b>Чем меньше Job Size — тем ВЫШЕ WSJF</b> при равном CoD. Поэтому маленькие ценные задачи всегда идут первыми.</td></tr>'
+'</table></div>'
+'<div class="t-h3">📊 Пример расчёта WSJF — 3 задачи финтех-стартапа</div>'
+'<div class="tw"><table>'
+'<tr><th>Задача</th><th>Бизнес-ценность</th><th>Срочность</th><th>Снижение риска</th><th>CoD (сумма)</th><th>Job Size</th><th style="color:#f59e0b">WSJF</th><th>Приоритет</th></tr>'
+'<tr><td>Интеграция СБП (быстрые платежи)</td><td>8</td><td>13</td><td>5</td><td>26</td><td>5</td><td><b style="color:#f59e0b">5.2</b></td><td>🥇 1-й</td></tr>'
+'<tr><td>Дашборд аналитики</td><td>13</td><td>3</td><td>2</td><td>18</td><td>8</td><td><b style="color:#f59e0b">2.25</b></td><td>🥈 2-й</td></tr>'
+'<tr><td>Ребрендинг интерфейса</td><td>5</td><td>2</td><td>1</td><td>8</td><td>13</td><td><b style="color:#f59e0b">0.62</b></td><td>🥉 3-й</td></tr>'
+'</table></div>'
+'<div class="t-h3">Шкала оценки WSJF — какие баллы использовать</div>'
+'<div class="info-box yellow"><b>Доступные значения: 1, 2, 3, 5, 8, 13, 21</b> (шкала Фибоначчи). Принцип: оценки ОТНОСИТЕЛЬНЫЕ, не абсолютные. Сначала команда берёт «эталонный» элемент и присваивает ему базовое значение (например, 3 или 5), затем всё остальное оценивает относительно него.</div>'
+'<div class="tw"><table>'
+'<tr><th>Балл</th><th>Смысл для CoD-компонентов (бизнес-ценность, срочность, риск)</th><th>Смысл для Job Size</th></tr>'
+'<tr><td><b style="color:#6ee7b7">1</b></td><td>Почти нет ценности / почти нет срочности</td><td>Задача на 1-2 часа, тривиальная</td></tr>'
+'<tr><td><b style="color:#6ee7b7">2</b></td><td>Минимальная ценность / низкая срочность</td><td>Несколько часов</td></tr>'
+'<tr><td><b style="color:#6ee7b7">3</b></td><td>Ниже среднего</td><td>День-два работы</td></tr>'
+'<tr><td><b style="color:#f59e0b">5</b></td><td>Средняя ценность / умеренная срочность (базовый эталон)</td><td>Неделя работы</td></tr>'
+'<tr><td><b style="color:#f59e0b">8</b></td><td>Высокая ценность / заметная срочность</td><td>2 недели (спринт)</td></tr>'
+'<tr><td><b style="color:#ef4444">13</b></td><td>Очень высокая / критичная срочность (есть дедлайн)</td><td>Месяц работы</td></tr>'
+'<tr><td><b style="color:#ef4444">21</b></td><td>Экстремальная / «горит», потери огромны при задержке</td><td>Квартал и более — нужна декомпозиция</td></tr>'
+'</table></div>'
+'<div class="t-h3">Как проводить оценку WSJF на практике</div>'
+'<div class="info-box green"><b>Шаг 1:</b> Собрать команду (PO, BA, лиды). <b>Шаг 2:</b> Выбрать «средний» элемент как эталон (5 баллов). <b>Шаг 3:</b> Оценить каждый компонент CoD относительно эталона (Planning Poker). <b>Шаг 4:</b> Оценить Job Size отдельно — это объём работы, не ценность. <b>Шаг 5:</b> Рассчитать WSJF = CoD ÷ Job Size. <b>Шаг 6:</b> Отсортировать по убыванию WSJF — наверх самые приоритетные.</div>'
+'<div class="info-box green">Вывод из примера: Дашборд имеет <b>самую высокую бизнес-ценность (13)</b>, но из-за большого размера (8) и низкой срочности — WSJF всего 2.25. Интеграция СБП побеждает благодаря <b>высокой срочности (13)</b> — рыночное окно, конкуренты уже запустили. WSJF показывает: ценная, но большая задача может уступить менее ценной, но срочной и быстрой.</div>'
+'<div class="t-h3">⚠️ Ограничения WSJF</div>'
+'<div class="cards">'
+'<div class="card c4"><h4>Субъективность оценок<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Estimate subjectivity</span></h4><p>Несмотря на формулу, оценка CoD и Job Size — относительная и зависит от команды. Разные люди дадут разные числа.</p></div>'
+'<div class="card c4"><h4>Не учитывает зависимости<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Does not account for dependencies</span></h4><p>Задача А с низким WSJF может быть блокером для задачи Б с высоким WSJF. WSJF не видит граф зависимостей.</p></div>'
+'<div class="card c4"><h4>Устаревание оценок<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Estimates go stale</span></h4><p>Конкурент выпустил фичу — срочность выросла. Нашли простое решение — Job Size снизился. Переоценивай перед каждым спринтом.</p></div>'
+'<div class="card c4"><h4>Трудоёмкость<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Time-consuming</span></h4><p>Для мелких правок избыточен. Применять для крупных фич, эпиков, инициатив с высокой неопределённостью.</p></div>'
+'</div>',

ba_role:'<div class="t-h3">6 областей знаний BABOK v3</div>'
+'<div class="cards">'
+'<div class="card c1"><h4>1. Планирование и мониторинг<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">1. Business Analysis Planning and Monitoring</span></h4><p>Как организовать работу BA. Выбор подхода, управление информацией.</p></div>'
+'<div class="card c2"><h4>2. Выявление и сотрудничество<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">2. Elicitation and Collaboration</span></h4><p>Техники сбора требований. Управление коммуникацией со стейкхолдерами.</p></div>'
+'<div class="card c4"><h4>3. Управление ЖЦ требований<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">3. Requirements Life Cycle Management</span></h4><p>Трассировка, приоритизация, управление изменениями.</p></div>'
+'<div class="card c3"><h4>4. Анализ стратегии<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">4. Strategy Analysis</span></h4><p>Понять контекст. SWOT, анализ текущего и целевого состояния.</p></div>'
+'<div class="card c1"><h4>5. Анализ требований и дизайн<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">5. Requirements Analysis and Design Definition</span></h4><p>Моделирование, верификация, валидация. US, Use Case, BPMN.</p></div>'
+'<div class="card c2"><h4>6. Оценка решения<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">6. Solution Evaluation</span></h4><p>Измерение ценности, оценка ограничений, рекомендации.</p></div>'
+'</div>'
+'<div class="t-h3">Трассировка требований (RTM)</div>'
+'<div class="info-box green">Связывает требования всех уровней и тест-кейсы. Бизнес-цель → требование стейкхолдера → US → тест. Без трассировки легко реализовать ненужные функции (gold plating).</div>'
+'<div class="t-h3">Жизненный цикл требований</div>'
+'<div class="info-box">Выявление → Анализ → Документирование → Верификация → Валидация → Управление изменениями. В Agile — итеративный цикл каждый спринт.</div>'
+'<div class="t-h3">Конфликт требований: как разрешать</div>'
+'<div class="info-box yellow">1) Зафиксировать конфликт. 2) Организовать встречу со всеми стейкхолдерами. 3) Выяснить корневые цели каждого. 4) Найти компромисс. BA — медиатор, не арбитр. Решение принимают стейкхолдеры.</div>',

discovery_docs:'<div class="t-h3">Сравнение: Discovery Phase · SRS · Vision/Scope</div>'
+'<div class="info-box">Три ключевых понятия, которые часто путают или смешивают. Каждое отвечает на свой вопрос и живёт на своём этапе проекта.</div>'
+'<div class="tw"><table>'
+'<tr><th></th>'
+'<th style="color:#f59e0b">🔭 Discovery Phase<br><span style="font-size:0.72rem;color:#64748b">Фаза исследования</span></th>'
+'<th style="color:#93c5fd">📋 SRS<br><span style="font-size:0.72rem;color:#64748b">Software Requirements Specification</span></th>'
+'<th style="color:#6ee7b7">🎯 Vision & Scope<br><span style="font-size:0.72rem;color:#64748b">Видение и границы проекта</span></th>'
+'</tr>'
+'<tr><td><b>Что это?</b></td>'
+'<td>Процесс (этап работы), не документ. Исследование проблемы, рынка, пользователей до начала разработки</td>'
+'<td>Формальный документ — полная спецификация требований к программной системе</td>'
+'<td>Короткий документ верхнего уровня — зачем проект и что входит/не входит в его рамки</td>'
+'</tr>'
+'<tr><td><b>Главный вопрос</b></td>'
+'<td>«Что за проблему мы решаем и стоит ли её решать?»</td>'
+'<td>«Как именно система должна себя вести?»</td>'
+'<td>«Зачем этот проект и каковы его границы?»</td>'
+'</tr>'
+'<tr><td><b>Когда создаётся</b></td>'
+'<td>До начала разработки. Первый этап любого проекта</td>'
+'<td>После Discovery, до или во время разработки</td>'
+'<td>На выходе Discovery или в начале проекта, до SRS</td>'
+'</tr>'
+'<tr><td><b>Кто создаёт</b></td>'
+'<td>BA, Product Manager, UX Researcher — в команде</td>'
+'<td>BA, Systems Analyst, иногда совместно с архитектором</td>'
+'<td>BA совместно с Product Owner и спонсором проекта</td>'
+'</tr>'
+'<tr><td><b>Аудитория</b></td>'
+'<td>Команда, стейкхолдеры, инвесторы</td>'
+'<td>Разработчики, тестировщики, архитекторы</td>'
+'<td>Спонсор, стейкхолдеры, PM, BA — все участники</td>'
+'</tr>'
+'<tr><td><b>Уровень детализации</b></td>'
+'<td>Высокоуровневый — идеи, гипотезы, инсайты</td>'
+'<td>Максимальный — точные функциональные и нефункциональные требования</td>'
+'<td>Минимальный — цели, ограничения, что НЕ входит в scope</td>'
+'</tr>'
+'<tr><td><b>Объём</b></td>'
+'<td>Не документ — это серия активностей (интервью, исследования, прототипы)</td>'
+'<td>От 20 до 200+ страниц в сложных проектах</td>'
+'<td>1–5 страниц максимум</td>'
+'</tr>'
+'<tr><td><b>Результат</b></td>'
+'<td>Vision & Scope, Problem Statement, User Research, As-Is/To-Be карты процессов</td>'
+'<td>Полная спецификация: UC/US, FR, NFR, ограничения, интерфейсы</td>'
+'<td>Бизнес-требования верхнего уровня, Project Charter</td>'
+'</tr>'
+'</table></div>'

+'<div class="t-h3">🔭 Discovery Phase — подробнее</div>'
+'<div class="info-box green">Discovery Phase — это не одна встреча и не один документ. Это <b>структурированный процесс исследования</b>, который предшествует любой разработке. Цель: понять реальную проблему, а не сразу строить решение.</div>'
+'<div class="cards">'
+'<div class="card c4"><h4>1. Problem Definition<br><span style="font-size:0.7rem;color:#64748b">Определение проблемы</span></h4><p>Что болит у бизнеса? Какую проблему мы решаем? Метод «5 Почему». Не путать проблему с решением — «нам нужна кнопка» ≠ проблема.</p></div>'
+'<div class="card c4"><h4>2. Stakeholder Research<br><span style="font-size:0.7rem;color:#64748b">Исследование стейкхолдеров</span></h4><p>Кто заинтересован в результате? Карта стейкхолдеров (Stakeholder Map). Матрица влияния/интереса.</p></div>'
+'<div class="card c4"><h4>3. User Research<br><span style="font-size:0.7rem;color:#64748b">Исследование пользователей</span></h4><p>Интервью, наблюдение, опросы. User Personas, Customer Journey Map, Jobs-To-Be-Done. «Кто наш пользователь и что он хочет достичь?»</p></div>'
+'<div class="card c4"><h4>4. As-Is Process Analysis<br><span style="font-size:0.7rem;color:#64748b">Анализ текущих процессов</span></h4><p>BPMN-диаграмма «как есть». Выявление узких мест, дублирований, ручного труда. Основа для To-Be модели.</p></div>'
+'<div class="card c4"><h4>5. Market & Competitor Analysis<br><span style="font-size:0.7rem;color:#64748b">Анализ рынка и конкурентов</span></h4><p>Что уже существует? Как конкуренты решают эту проблему? Что будет нашим отличием?</p></div>'
+'<div class="card c4"><h4>6. Feasibility Assessment<br><span style="font-size:0.7rem;color:#64748b">Оценка реализуемости</span></h4><p>Технически возможно? Экономически обоснованно? Укладываемся ли в сроки? Риски. Go/No-Go решение.</p></div>'
+'</div>'
+'<div class="info-box">Результаты Discovery: <b>Vision & Scope документ, Problem Statement, High-Level User Stories (Эпики), As-Is и To-Be BPMN-диаграммы, Stakeholder Map, Personas</b>. Discovery предшествует написанию SRS.</div>'

+'<div class="t-h3">📋 SRS — Software Requirements Specification</div>'
+'<div class="info-box">SRS (IEEE 830 / ГОСТ 34) — формальный документ, описывающий всё, что система должна делать. Основной артефакт BA в Waterfall-проектах. В Agile роль SRS частично выполняет Product Backlog + AC.</div>'
+'<div class="tw"><table>'
+'<tr><th>Раздел SRS</th><th>Что содержит</th></tr>'
+'<tr><td><b style="color:#f59e0b">1. Введение</b><br><span style="font-size:0.72rem;color:#64748b">Introduction</span></td><td>Цель документа, область применения, определения и аббревиатуры, ссылки на другие документы</td></tr>'
+'<tr><td><b style="color:#f59e0b">2. Общее описание</b><br><span style="font-size:0.72rem;color:#64748b">Overall Description</span></td><td>Перспектива продукта, функции, характеристики пользователей, ограничения, зависимости</td></tr>'
+'<tr><td><b style="color:#93c5fd">3. Функциональные требования</b><br><span style="font-size:0.72rem;color:#64748b">Functional Requirements</span></td><td>Use Cases / User Stories с AC. Что система делает. Основной объём документа</td></tr>'
+'<tr><td><b style="color:#6ee7b7">4. Нефункциональные требования</b><br><span style="font-size:0.72rem;color:#64748b">Non-Functional Requirements</span></td><td>Производительность, безопасность, доступность, масштабируемость, юзабилити (FURPS+)</td></tr>'
+'<tr><td><b style="color:#94a3b8">5. Внешние интерфейсы</b><br><span style="font-size:0.72rem;color:#64748b">External Interfaces</span></td><td>UI-интерфейсы, API-интеграции, аппаратные интерфейсы, коммуникационные протоколы</td></tr>'
+'<tr><td><b style="color:#94a3b8">6. Ограничения и допущения</b><br><span style="font-size:0.72rem;color:#64748b">Constraints & Assumptions</span></td><td>Регуляторные ограничения, технические ограничения, бизнес-правила, предположения</td></tr>'
+'</table></div>'
+'<div class="info-box yellow"><b>SRS в Agile:</b> Полный SRS редко пишется в Agile-проектах. Его заменяет Product Backlog (User Stories + AC) + отдельные спецификации для сложных модулей (API-спеки, интеграционные требования). Иногда BA пишет «lightweight SRS» — 10-20 страниц для ключевых требований.</div>'

+'<div class="t-h3">🎯 Vision & Scope Document</div>'
+'<div class="info-box">Vision & Scope — самый первый документ проекта. Отвечает на вопрос «Зачем мы это делаем и что входит в границы?». Написан до SRS, на основе результатов Discovery.</div>'
+'<div class="tw"><table>'
+'<tr><th>Раздел</th><th>Содержание</th><th>Пример</th></tr>'
+'<tr><td><b style="color:#6ee7b7">Business Requirements</b><br><span style="font-size:0.72rem;color:#64748b">Бизнес-требования</span></td><td>Бизнес-проблема, возможность, цель проекта в измеримых показателях</td><td>«Сократить время онбординга клиента с 5 дней до 1 дня»</td></tr>'
+'<tr><td><b style="color:#6ee7b7">Vision Statement</b><br><span style="font-size:0.72rem;color:#64748b">Видение продукта</span></td><td>Краткое вдохновляющее описание продукта и его ценности</td><td>«Платформа самообслуживания, позволяющая клиентам банка открывать продукты без посещения офиса»</td></tr>'
+'<tr><td><b style="color:#93c5fd">Scope</b><br><span style="font-size:0.72rem;color:#64748b">Границы проекта</span></td><td>Что ВКЛЮЧЕНО в первую версию (in scope)</td><td>«Онлайн-открытие текущего счёта, выпуск дебетовой карты»</td></tr>'
+'<tr><td><b style="color:#ef4444">Out of Scope</b><br><span style="font-size:0.72rem;color:#64748b">Вне границ</span></td><td>Что явно НЕ входит — критически важно зафиксировать!</td><td>«Кредитные продукты, бизнес-счета, мобильное приложение — в версии 1.0 не включены»</td></tr>'
+'<tr><td><b style="color:#94a3b8">Stakeholders</b><br><span style="font-size:0.72rem;color:#64748b">Заинтересованные стороны</span></td><td>Список стейкхолдеров, их роли и интересы</td><td>«Директор по ритейлу — спонсор; Клиент банка — конечный пользователь»</td></tr>'
+'<tr><td><b style="color:#94a3b8">Risks & Assumptions</b><br><span style="font-size:0.72rem;color:#64748b">Риски и допущения</span></td><td>Ключевые риски проекта и принятые допущения</td><td>«Допущение: API регулятора доступен для интеграции. Риск: изменения ФЗ о цифровой подписи»</td></tr>'
+'</table></div>'
+'<div class="info-box green"><b>Почему Out of Scope критически важен:</b> без явного «что НЕ входит» каждый стейкхолдер достраивает scope в голове самостоятельно. Это главная причина scope creep — когда в ходе проекта внезапно «появляются» требования, которые «все подразумевали» но никто не зафиксировал.</div>'

+'<div class="t-h3">📐 Полная структура документа (шаблон Карла Вигерса) / Full Structure (Karl Wiegers Template)</div>'
+'<div class="info-box">Классический шаблон Vision & Scope (Karl Wiegers, «Software Requirements») состоит из 4 крупных разделов, каждый из которых раскладывается на подпункты. Это эталонная структура, которую спрашивают на интервью BA — важно знать не только названия разделов, но и что именно пишут внутри каждого.</div>'

+'<div class="cards">'
+'<div class="card c4"><h4>1. Business Requirements<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Бизнес-требования</span></h4><p>Зачем и почему — обоснование проекта с точки зрения бизнеса.</p></div>'
+'<div class="card c2"><h4>2. Vision of the Solution<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Видение решения</span></h4><p>Что мы строим — общая картина продукта и его ключевых возможностей.</p></div>'
+'<div class="card c1"><h4>3. Scope and Limitations<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Границы и ограничения</span></h4><p>Что входит в релизы, а что явно исключено.</p></div>'
+'<div class="card c3"><h4>4. Business Context<br><span style="font-size:0.7rem;color:#64748b;font-weight:400">Бизнес-контекст</span></h4><p>Кто участвует, что важнее всего, в какой среде работаем.</p></div>'
+'</div>'

+'<div class="tw"><table>'
+'<tr><th>§</th><th>Подраздел</th><th>Что описывает</th></tr>'
+'<tr><td colspan="3" style="background:#1a1f2e;color:#f59e0b;font-weight:700">1. Business Requirements — Бизнес-требования</td></tr>'
+'<tr><td>1.1</td><td><b style="color:#f59e0b">Background</b><br><span style="font-size:0.72rem;color:#64748b">Предыстория</span></td><td>Контекст: как компания пришла к необходимости проекта, что происходило до этого момента</td></tr>'
+'<tr><td>1.2</td><td><b style="color:#f59e0b">Business Opportunity</b><br><span style="font-size:0.72rem;color:#64748b">Бизнес-возможность</span></td><td>Проблема или рыночная возможность, которую решает проект. «Какую боль/шанс мы закрываем?»</td></tr>'
+'<tr><td>1.3</td><td><b style="color:#f59e0b">Business Objectives and Success Criteria</b><br><span style="font-size:0.72rem;color:#64748b">Бизнес-цели и критерии успеха</span></td><td>Измеримые бизнес-цели проекта (часто SMART) и то, как мы поймём, что проект удался — конкретные KPI. «Сократить отток клиентов на 10% за год»</td></tr>'
+'<tr><td>1.4</td><td><b style="color:#f59e0b">Customer or Market Needs</b><br><span style="font-size:0.72rem;color:#64748b">Потребности клиента или рынка</span></td><td>Что нужно клиентам и рынку, результаты исследований и опросов</td></tr>'
+'<tr><td>1.5</td><td><b style="color:#f59e0b">Business Risks</b><br><span style="font-size:0.72rem;color:#64748b">Бизнес-риски</span></td><td>Что может пойти не так с точки зрения бизнеса: рыночные, финансовые, регуляторные риски</td></tr>'

+'<tr><td colspan="3" style="background:#1a1f2e;color:#6ee7b7;font-weight:700">2. Vision of the Solution — Видение решения</td></tr>'
+'<tr><td>2.1</td><td><b style="color:#6ee7b7">Vision Statement</b><br><span style="font-size:0.72rem;color:#64748b">Формулировка видения</span></td><td>Одно-два предложения, вдохновляюще описывающие продукт и его ценность</td></tr>'
+'<tr><td>2.2</td><td><b style="color:#6ee7b7">Major Features</b><br><span style="font-size:0.72rem;color:#64748b">Основные функции</span></td><td>Список ключевых возможностей продукта верхнего уровня — без деталей реализации</td></tr>'
+'<tr><td>2.3</td><td><b style="color:#6ee7b7">Assumptions and Dependencies</b><br><span style="font-size:0.72rem;color:#64748b">Допущения и зависимости</span></td><td>Что мы считаем верным без доказательств (допущения) и от чего проект зависит (внешние системы, команды, сроки)</td></tr>'

+'<tr><td colspan="3" style="background:#1a1f2e;color:#93c5fd;font-weight:700">3. Scope and Limitations — Границы и ограничения</td></tr>'
+'<tr><td>3.1</td><td><b style="color:#93c5fd">Scope of Initial Release</b><br><span style="font-size:0.72rem;color:#64748b">Границы первого релиза</span></td><td>Что именно войдёт в MVP / первую поставку — конкретный, закрытый список</td></tr>'
+'<tr><td>3.2</td><td><b style="color:#93c5fd">Scope of Subsequent Releases</b><br><span style="font-size:0.72rem;color:#64748b">Границы последующих релизов</span></td><td>Что запланировано на будущее, но не в первой версии — управляет ожиданиями стейкхолдеров</td></tr>'
+'<tr><td>3.3</td><td><b style="color:#93c5fd">Limitations and Exclusions</b><br><span style="font-size:0.72rem;color:#64748b">Ограничения и исключения</span></td><td>Что прямо и навсегда исключено из проекта, а также технические/бюджетные/временные ограничения</td></tr>'

+'<tr><td colspan="3" style="background:#1a1f2e;color:#c4b5fd;font-weight:700">4. Business Context — Бизнес-контекст</td></tr>'
+'<tr><td>4.1</td><td><b style="color:#c4b5fd">Stakeholder Profiles</b><br><span style="font-size:0.72rem;color:#64748b">Профили заинтересованных сторон</span></td><td>Кто стейкхолдеры, их роли, интересы и уровень влияния на проект</td></tr>'
+'<tr><td>4.2</td><td><b style="color:#c4b5fd">Project Priorities</b><br><span style="font-size:0.72rem;color:#64748b">Приоритеты проекта</span></td><td>Баланс между Scope / Schedule / Budget / Quality — что важнее при конфликте</td></tr>'

techniques:'<div class="t-h3">🔎 Root Cause Analysis — Поиск первопричины</div>'
+'<div class="info-box">Частая ошибка джуна — фиксировать СИМПТОМ («пользователи жалуются на медленный чекаут») и сразу писать требование на его устранение, не разобравшись в причине. Middle/Senior BA обязан докопаться до КОРНЯ проблемы, иначе решение окажется косметическим.</div>'

+'<div class="t-h3">1. 5 Whys (5 Почему)</div>'
+'<div class="info-box">Простейшая техника: задаём вопрос «Почему?» к каждому предыдущему ответу, обычно 5 раз, пока не дойдём до устранимой первопричины.</div>'
+'<div class="tw"><table>'
+'<tr><th>Шаг</th><th>Вопрос</th><th>Ответ</th></tr>'
+'<tr><td>Симптом</td><td>—</td><td>Клиенты бросают корзину на этапе оплаты</td></tr>'
+'<tr><td>Почему? #1</td><td>Почему бросают корзину?</td><td>Потому что форма оплаты выдаёт ошибку</td></tr>'
+'<tr><td>Почему? #2</td><td>Почему форма выдаёт ошибку?</td><td>Потому что платёжный шлюз таймаутит</td></tr>'
+'<tr><td>Почему? #3</td><td>Почему шлюз таймаутит?</td><td>Потому что запрос идёт синхронно и ждёт 30 сек без ретрая</td></tr>'
+'<tr><td>Почему? #4</td><td>Почему нет ретрая?</td><td>Потому что интеграцию делали быстро на MVP-этапе без NFR на отказоустойчивость</td></tr>'
+'<tr><td>Почему? #5 — корень</td><td>Почему не заложили NFR?</td><td><b style="color:#6ee7b7">В момент запуска не было BA, а разработчик не собирал нефункциональные требования</b></td></tr>'
+'</table></div>'
+'<div class="info-box yellow"><b>Важно:</b> 5 — не догма, это может быть 3 или 7 «Почему». Останавливаемся, когда причина СИСТЕМНАЯ и УСТРАНИМАЯ (не «люди плохие», а «нет процесса/NFR/контроля»). Слабость техники — субъективность: разные аналитики могут прийти к разным цепочкам, поэтому 5 Whys часто делают в группе, а не в одиночку.</div>'

+'<div class="t-h3">2. Диаграмма Исикавы (Fishbone / Cause-and-Effect)</div>'

+'<div class="t-h3">RACI — Responsible, Accountable, Consulted, Informed</div>'
+'<div class="tw"><table>'
+'<tr><th>Буква</th><th>Роль</th><th>Смысл</th></tr>'
+'<tr><td><b style="color:#6ee7b7">R</b> — Responsible</td><td>Исполнитель</td><td>Тот, кто РЕАЛЬНО делает работу (пишет код, тестирует)</td></tr>'
+'<tr><td><b style="color:#f59e0b">A</b> — Accountable</td><td>Ответственный / Владелец</td><td>Тот, кто отвечает за РЕЗУЛЬТАТ и принимает финальное решение. <b>Должен быть РОВНО ОДИН на задачу</b> — иначе размывается ответственность</td></tr>'
+'<tr><td><b style="color:#93c5fd">C</b> — Consulted</td><td>Консультируемый</td><td>Его мнение СПРАШИВАЮТ до принятия решения (двусторонняя коммуникация)</td></tr>'
+'<tr><td><b style="color:#c4b5fd">I</b> — Informed</td><td>Информируемый</td><td>Его просто СТАВЯТ В ИЗВЕСТНОСТЬ по факту (односторонняя коммуникация, после решения)</td></tr>'
+'</table></div>'
